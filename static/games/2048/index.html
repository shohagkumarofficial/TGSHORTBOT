<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048 Puzzle</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <link rel="stylesheet" href="/static/games/shared/shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Game HUD -->
  <header class="game-hud">
    <button class="btn-back-hub" id="btn-back-hud">⬅ Hub</button>
    <div class="game-title-hud">🔢 2048 Puzzle</div>
    <div class="hud-lives">
      <span>❤️</span>
      <span id="hud-lives-count">3/3</span>
    </div>
  </header>

  <!-- Game Container -->
  <main class="game-container">
    <div class="score-banner">
      <div>SCORE: <span id="score-display" class="highlight">0</span></div>
      <div>HIGH: <span id="high-score-display">0</span></div>
    </div>

    <!-- 2048 Grid Board -->
    <div class="grid-container" id="grid-container">
      <div class="grid-row">
        <div class="grid-cell" id="cell-0-0"></div>
        <div class="grid-cell" id="cell-0-1"></div>
        <div class="grid-cell" id="cell-0-2"></div>
        <div class="grid-cell" id="cell-0-3"></div>
      </div>
      <div class="grid-row">
        <div class="grid-cell" id="cell-1-0"></div>
        <div class="grid-cell" id="cell-1-1"></div>
        <div class="grid-cell" id="cell-1-2"></div>
        <div class="grid-cell" id="cell-1-3"></div>
      </div>
      <div class="grid-row">
        <div class="grid-cell" id="cell-2-0"></div>
        <div class="grid-cell" id="cell-2-1"></div>
        <div class="grid-cell" id="cell-2-2"></div>
        <div class="grid-cell" id="cell-2-3"></div>
      </div>
      <div class="grid-row">
        <div class="grid-cell" id="cell-3-0"></div>
        <div class="grid-cell" id="cell-3-1"></div>
        <div class="grid-cell" id="cell-3-2"></div>
        <div class="grid-cell" id="cell-3-3"></div>
      </div>
    </div>

    <div class="instructions-text">
      Swipe or use Arrow Keys to merge matching tiles!
    </div>
  </main>

  <!-- Shared Game Over Dialog -->
  <div class="game-over-dialog" id="game-over-dialog">
    <div class="go-card">
      <div class="go-emoji" id="go-emoji">💀</div>
      <h3 class="go-title" id="go-title">Game Over</h3>
      <div class="go-stats">
        <div class="go-stat-item">
          <div class="label">Score</div>
          <div class="val" id="go-score-val">0</div>
        </div>
        <div class="go-stat-item">
          <div class="label">High Score</div>
          <div class="val gold" id="go-high-val">0</div>
        </div>
      </div>
      <div class="go-lives-remain" id="go-lives-val">3 Lives Remaining</div>
      <div class="go-actions">
        <button class="btn-go-play" id="btn-go-play">▶ Play Again</button>
        <button class="btn-go-ad" id="btn-go-ad">📺 Watch Ad for Life (+1 ❤️)</button>
        <button class="btn-go-hub" id="btn-go-hub">⬅ Return to Hub</button>
      </div>
    </div>
  </div>

  <script src="/static/js/telegram.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ads.js"></script>
  <script src="/static/games/shared/bridge.js"></script>
  <script src="game.js"></script>
</body>
</html>
