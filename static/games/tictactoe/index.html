<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tic Tac Toe</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <link rel="stylesheet" href="/static/games/shared/shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Game HUD -->
  <header class="game-hud">
    <button class="btn-back-hub" id="btn-back-hud">⬅ Hub</button>
    <div class="game-title-hud">❌ Tic Tac Toe (AI)</div>
    <div class="hud-lives">
      <span>❤️</span>
      <span id="hud-lives-count">3/3</span>
    </div>
  </header>

  <!-- Game Container -->
  <main class="game-container">
    <!-- Difficulty Selector -->
    <div class="diff-bar">
      <button class="btn-diff active" data-diff="easy">Easy</button>
      <button class="btn-diff" data-diff="medium">Medium</button>
      <button class="btn-diff" data-diff="hard">Master</button>
    </div>

    <!-- Status Banner -->
    <div class="status-banner" id="status-banner">Your Turn (❌)</div>

    <!-- 3x3 Grid -->
    <div class="ttt-board" id="ttt-board">
      <div class="ttt-cell" data-idx="0"></div>
      <div class="ttt-cell" data-idx="1"></div>
      <div class="ttt-cell" data-idx="2"></div>
      <div class="ttt-cell" data-idx="3"></div>
      <div class="ttt-cell" data-idx="4"></div>
      <div class="ttt-cell" data-idx="5"></div>
      <div class="ttt-cell" data-idx="6"></div>
      <div class="ttt-cell" data-idx="7"></div>
      <div class="ttt-cell" data-idx="8"></div>
    </div>

    <div class="stats-row">
      <div>Wins: <span id="wins-count" class="highlight">0</span></div>
      <div>Losses: <span id="losses-count">0</span></div>
      <div>Draws: <span id="draws-count">0</span></div>
    </div>
  </main>

  <!-- Shared Game Over Dialog -->
  <div class="game-over-dialog" id="game-over-dialog">
    <div class="go-card">
      <div class="go-emoji" id="go-emoji">💀</div>
      <h3 class="go-title" id="go-title">Game Over</h3>
      <div class="go-stats">
        <div class="go-stat-item">
          <div class="label">Score (Wins)</div>
          <div class="val" id="go-score-val">0</div>
        </div>
        <div class="go-stat-item">
          <div class="label">High Score</div>
          <div class="val gold" id="go-high-val">0</div>
        </div>
      </div>
      <div class="go-lives-remain" id="go-lives-val">3 Lives Remaining</div>
      <div class="go-actions">
        <button class="btn-go-play" id="btn-go-play">▶ Play Again</button>
        <button class="btn-go-ad" id="btn-go-ad">📺 Watch Ad for Life (+1 ❤️)</button>
        <button class="btn-go-hub" id="btn-go-hub">⬅ Return to Hub</button>
      </div>
    </div>
  </div>

  <script src="/static/js/telegram.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/ads.js"></script>
  <script src="/static/games/shared/bridge.js"></script>
  <script src="game.js"></script>
</body>
</html>
