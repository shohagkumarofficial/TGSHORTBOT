services:
  - type: web
    name: telegram-game-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: WEBAPP_BASE_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: ADSGRAM_BLOCK_ID
        sync: false
      - key: MONETAG_ZONE_ID
        sync: false
