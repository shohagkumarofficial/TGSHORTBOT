services:
  - type: web
    name: tgshortbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: WEBAPP_BASE_URL
        sync: false
      - key: DATA_FILE
        value: data/store.json
      - key: CPM_CHECK_INTERVAL_SECONDS
        value: "60"
