<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>TGSHORTBOT Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141c;
    --panel: #1a1e2a;
    --panel-raised: #212637;
    --hairline: #2b3040;
    --brass: #d9a441;
    --brass-soft: rgba(217,164,65,.14);
    --emerald: #3fbf7f;
    --emerald-soft: rgba(63,191,127,.14);
    --red: #e2685c;
    --red-soft: rgba(226,104,92,.14);
    --violet: #9c8cf2;
    --violet-soft: rgba(156,140,242,.14);
    --text: #f1ede4;
    --text-dim: #9aa0b4;
    --text-faint: #5c6278;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    -webkit-tap-highlight-color: transparent;
  }
  #app{ padding: 16px 16px 24px; max-width: 640px; margin: 0 auto; }
  #app.has-bottom-nav{ padding-bottom: 94px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px;
  }
  .brand{
    font-family: var(--display); font-weight:700; font-size:17px; letter-spacing:-.01em;
    display:flex; align-items:center; gap:8px;
  }
  .brand .mark{
    width:26px; height:26px; border-radius:8px;
    background: linear-gradient(145deg, #e7bb63, var(--brass));
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:#12141c;
  }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .role-badge{
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    padding: 5px 10px; border-radius: 999px;
    background: var(--panel-raised); color: var(--text-dim);
    border: 1px solid var(--hairline);
    cursor: pointer;
  }
  .role-badge.owner{ color: var(--violet); border-color: rgba(156,140,242,.35); background: var(--violet-soft); }
  .role-badge.admin{ color: var(--brass); border-color: rgba(217,164,65,.35); background: var(--brass-soft); }
  .role-badge.sub_admin{ color: var(--emerald); border-color: rgba(63,191,127,.35); background: var(--emerald-soft); }
  .role-badge.viewer{ color: var(--text-dim); border-color: var(--hairline); background: var(--panel-raised); }

  .menu-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--hairline);
    background: var(--panel-raised); color: var(--text); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
    position:relative;
  }
  .balance-card{
    background: linear-gradient(160deg, var(--panel-raised), var(--panel));
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .balance-card.owner-card{
    background: linear-gradient(160deg, rgba(156,140,242,.10), var(--panel));
    border-color: rgba(156,140,242,.25);
  }
  .balance-row{ display:flex; gap: 22px; }
  .balance-item .label{ font-size:11px; color: var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .balance-item .value{ font-family: var(--display); font-weight:700; font-size:24px; }
  .balance-item.confirmed .value{ color: var(--emerald); }
  .balance-item.pending .value{ color: var(--brass); }
  .balance-item.violet .value{ color: var(--violet); }
  .cycle-note{ margin-top:14px; font-size:12px; color: var(--text-dim); border-top:1px solid var(--hairline); padding-top:12px; }
  .cycle-note b{ color: var(--text); }
  .owner-eyebrow{
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--violet);
    margin-bottom: 12px; font-weight:700;
  }

  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom: 16px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex: 0 0 auto;
    display:flex; align-items:center; gap:6px;
    font-family: var(--body); font-weight:600; font-size:13px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--hairline);
    padding: 9px 16px; border-radius: 999px; cursor:pointer;
    white-space: nowrap;
  }
  .tab-btn.active{
    color:#12141c; background: var(--brass); border-color: var(--brass);
  }
  .tab-badge{
    background: var(--red); color:#fff; font-size:10.5px; font-weight:700;
    min-width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    padding: 0 4px;
  }
  .tab-btn.active .tab-badge{ background:#12141c; color:var(--brass); }

  /* --- Bottom nav (Admin: Home / Short Link / My Links / Profile) --- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0;
    display:flex;
    background: var(--panel);
    border-top: 1px solid var(--hairline);
    padding: 6px 6px calc(env(safe-area-inset-bottom, 0px) + 6px);
    max-width: 640px; margin: 0 auto;
    z-index: 30;
  }
  .nav-item{
    flex:1; min-width:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding: 7px 2px 6px;
    border-radius: 12px;
    background:none; border:none; cursor:pointer;
    font-family: var(--body);
    color: var(--text-dim);
  }
  .nav-item:active{ background: var(--panel-raised); }
  .nav-item .nav-ic{ font-size:19px; line-height:1; }
  .nav-item .nav-label{ font-size:10.5px; font-weight:600; white-space:nowrap; }
  .nav-item.active{ color: var(--brass); }

  .card{
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h3{
    font-family: var(--display); font-size:14px; margin: 0 0 4px; letter-spacing:-.01em;
  }
  .card .meta{ font-size:12px; color: var(--text-dim); margin-bottom:10px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .pill{
    display:inline-flex; align-items:center; font-size:11px; font-weight:600;
    padding: 3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;
  }
  .pill.pending{ background: var(--brass-soft); color: var(--brass); }
  .pill.paid{ background: var(--emerald-soft); color: var(--emerald); }
  .pill.rejected{ background: var(--red-soft); color: var(--red); }
  .pill.active{ background: var(--emerald-soft); color: var(--emerald); }
  .pill.banned{ background: var(--red-soft); color: var(--red); }
  .pill.owner{ background: var(--violet-soft); color: var(--violet); }
  .pill.admin{ background: var(--brass-soft); color: var(--brass); }
  .pill.sub_admin{ background: var(--emerald-soft); color: var(--emerald); }
  .pill.viewer{ background: var(--panel-raised); color: var(--text-dim); }

  code.short-url{
    display:block; font-size: 12.5px; color: var(--text); background: var(--panel-raised);
    padding: 8px 10px; border-radius: 10px; margin: 8px 0; word-break: break-all;
    border: 1px solid var(--hairline);
  }

  label{ display:block; font-size:12px; color: var(--text-dim); margin: 12px 0 6px; }
  input[type=text], input[type=number], input[type=url], select{
    width:100%; background: var(--panel-raised); border: 1px solid var(--hairline);
    color: var(--text); font-family: var(--body); font-size:14px;
    padding: 11px 12px; border-radius: 10px; outline:none;
  }
  input:focus, select:focus{ border-color: var(--brass); }
  input.input-error, input.input-error:focus{ border-color: var(--red); }
  .field-error{
    display:none; font-size:12px; color: var(--red); margin-top:6px;
  }
  .field-error.show{ display:block; }

  .ts-item{
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding: 10px 0; border-bottom: 1px solid var(--hairline);
  }
  .ts-item:last-child{ border-bottom:none; }
  .ts-item .ts-info .ts-platform{ font-size:13px; font-weight:600; color: var(--text); }
  .ts-item .ts-info .ts-url{ font-size:12px; color: var(--brass); word-break: break-all; }
  .ts-item .ts-actions{ display:flex; gap:6px; flex:0 0 auto; }
  .ts-icon-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--hairline);
    background: var(--panel-raised); color: var(--text-dim); font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ts-icon-btn.danger{ color: var(--red); border-color: rgba(226,104,92,.3); }

  .btn{
    font-family: var(--body); font-weight:600; font-size:13.5px;
    border-radius: 10px; padding: 10px 16px; cursor:pointer; border: none;
  }
  .btn-primary{ background: var(--brass); color:#12141c; }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  .btn-outline{ background:none; border:1px solid var(--hairline); color: var(--text); }
  .btn-danger{ background: var(--red-soft); color: var(--red); border:1px solid rgba(226,104,92,.3); }
  .btn-success{ background: var(--emerald-soft); color: var(--emerald); border:1px solid rgba(63,191,127,.3); }
  .btn-sm{ padding: 7px 12px; font-size:12.5px; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:8px; margin-top:10px; }

  .empty{
    text-align:center; padding: 34px 12px; color: var(--text-faint); font-size:13px;
  }

  /* ---- outside-Telegram branded landing ------------------------------
     Shown whenever there's no Telegram initData: a real browser visit, a
     link preview, or an ad-network moderator opening the raw URL. Must
     look intentional and alive (not an error state) so a moderation
     reviewer can visually confirm the app is working. ------------------ */
  .landing{
    text-align:center; padding: 56px 20px 40px; max-width:340px; margin:0 auto;
  }
  .landing .landing-mark{
    width:64px; height:64px; border-radius:18px; margin:0 auto 18px;
    background: linear-gradient(145deg, #e7bb63, var(--brass));
    display:flex; align-items:center; justify-content:center;
    font-family: var(--display); font-weight:700; font-size:28px; color:#12141c;
  }
  .landing h1{
    font-family: var(--display); font-size:20px; font-weight:700; margin:0 0 10px; letter-spacing:-.01em;
  }
  .landing p{
    font-size:13.5px; color: var(--text-dim); line-height:1.55; margin:0 0 26px;
  }
  .landing .landing-privacy{
    display:block; margin-top:22px; font-size:12px;
    color: var(--text-dim); text-decoration:underline; text-underline-offset:2px;
  }
  .landing .landing-privacy:hover{ color: var(--text); }
  .landing .btn-primary{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    text-decoration:none; padding:13px 22px; font-size:14px;
  }

  .toast{
    position:fixed; left:50%; bottom:20px; transform: translateX(-50%) translateY(20px);
    background: var(--panel-raised); border:1px solid var(--hairline); color: var(--text);
    padding: 11px 18px; border-radius: 999px; font-size: 13px;
    opacity:0; transition: opacity .25s ease, transform .25s ease;
    pointer-events:none; z-index: 60; max-width: 90%; text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
  .toast.err{ border-color: rgba(226,104,92,.4); color: var(--red); }
  .toast.ok{ border-color: rgba(63,191,127,.4); color: var(--emerald); }

  .skel{ background: linear-gradient(90deg, var(--panel-raised) 25%, var(--hairline) 37%, var(--panel-raised) 63%); background-size: 400% 100%; animation: shimmer 1.3s ease infinite; border-radius: 8px; }
  @keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:0 0} }

  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .stat-grid-3{ grid-template-columns: repeat(3, 1fr); }
  .stat-grid-3 .stat-box{ padding: 12px 6px; text-align:center; }
  .stat-grid-3 .stat-box .n{ font-size:16px; }
  .stat-box{ background: var(--panel-raised); border:1px solid var(--hairline); border-radius:12px; padding:14px; }
  .stat-box .n{ font-family: var(--display); font-weight:700; font-size:22px; }
  .stat-box .l{ font-size:11px; color: var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  /* ---- Obsidian-style analytics home (Admin/Sub Admin Overview only —
     Owner gets a separate platform-wide dashboard later) ---- */
  .glow-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:16px; }
  .glow-card{
    position:relative; overflow:hidden;
    background: var(--panel-raised);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 16px;
  }
  .glow-card::before{
    content:""; position:absolute; top:-40%; right:-30%;
    width:110px; height:110px; border-radius:50%;
    filter: blur(28px); opacity:.32; pointer-events:none;
  }
  .glow-card.gold::before{ background: var(--brass); }
  .glow-card.emerald::before{ background: var(--emerald); }
  .glow-card.violet::before{ background: var(--violet); }
  .glow-card.blue::before{ background:#5aa9e6; }
  .glow-card .gc-icon{
    width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    margin-bottom:10px; position:relative;
  }
  .glow-card.gold .gc-icon{ background: var(--brass-soft); color: var(--brass); }
  .glow-card.emerald .gc-icon{ background: var(--emerald-soft); color: var(--emerald); }
  .glow-card.violet .gc-icon{ background: var(--violet-soft); color: var(--violet); }
  .glow-card.blue .gc-icon{ background: rgba(90,169,230,.14); color:#5aa9e6; }
  .glow-card .gc-value{ font-family: var(--display); font-weight:700; font-size:21px; position:relative; }
  .glow-card .gc-label{ font-size:10.5px; color: var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:4px; position:relative; }

  .chart-card{ background: var(--panel); border:1px solid var(--hairline); border-radius:16px; padding:16px; margin-bottom:14px; }
  .chart-card h3{ display:flex; align-items:center; gap:7px; margin:0 0 2px; font-size:14px; }
  .chart-card .chart-sub{ font-size:11.5px; color:var(--text-dim); margin-bottom:10px; }

  .top-link-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline); }
  .top-link-row:last-child{ border-bottom:none; }
  .top-link-row .tl-code{ font-weight:600; font-size:13px; }
  .top-link-row .tl-url{ font-size:11px; color:var(--text-faint); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top-link-row .tl-stats{ text-align:right; font-size:12px; color:var(--text-dim); line-height:1.5; }
  .top-link-row .tl-stats b{ color:var(--emerald); }

  /* Tap-a-point tooltip for the Overview earning/views trend charts —
     a small floating card showing that exact day's value, positioned
     via JS against the tapped point's real rendered position (see
     wireChartTooltips). Hidden by default; JS toggles ".show". */
  .chart-wrap{ position:relative; }
  .chart-tooltip{
    position:absolute; transform: translate(-50%, -122%);
    background: var(--panel-raised); border:1px solid var(--hairline);
    border-radius:9px; padding:6px 10px; font-size:11.5px; line-height:1.4;
    white-space:nowrap; color:var(--text); pointer-events:none; z-index:5;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.6);
    opacity:0; transition: opacity .15s ease;
  }
  .chart-tooltip::after{
    content:""; position:absolute; left:50%; top:100%;
    transform: translateX(-50%);
    border:5px solid transparent; border-top-color: var(--hairline);
  }
  .chart-tooltip.show{ opacity:1; }
  .chart-tooltip b{ color: var(--text); }

  .profile-header{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .profile-avatar{
    width:48px; height:48px; border-radius:50%; flex:0 0 auto;
    background: linear-gradient(145deg, #e7bb63, var(--brass));
    color:#12141c; font-family: var(--display); font-weight:700; font-size:19px;
    display:flex; align-items:center; justify-content:center;
  }
  .profile-name{ font-family: var(--display); font-weight:600; font-size:16px; }
  .profile-sub{ font-size:12px; color: var(--text-dim); margin-top:2px; }

  .section-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.1em; color: var(--text-faint);
    margin: 4px 0 10px;
  }

  /* --- Owner drawer / bottom sheet --- */
  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(6,7,11,.6);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:40;
  }
  .drawer-backdrop.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; left:0; right:0; bottom:0;
    background: var(--panel);
    border-top: 1px solid var(--hairline);
    border-radius: 20px 20px 0 0;
    padding: 10px 10px calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateY(105%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 41;
    max-width: 640px; margin: 0 auto;
    box-shadow: 0 -20px 50px -20px rgba(0,0,0,.6);
  }
  .drawer.open{ transform: translateY(0); }
  .drawer-handle{ width:36px; height:4px; border-radius:2px; background:var(--hairline); margin: 6px auto 10px; }
  .drawer-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.1em; color: var(--text-faint);
    padding: 4px 10px 8px;
  }
  .drawer-item{
    display:flex; align-items:center; gap:12px;
    padding: 12px 10px; border-radius: 12px; cursor:pointer;
  }
  .drawer-item:active{ background: var(--panel-raised); }
  .drawer-item .ic{
    width:36px; height:36px; border-radius:10px; background: var(--panel-raised);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex:0 0 auto;
  }
  .drawer-item .label-col{ flex:1; }
  .drawer-item .t{ font-size:14px; font-weight:600; color: var(--text); }
  .drawer-item .s{ font-size:11.5px; color: var(--text-dim); margin-top:1px; }
  .drawer-item .badge-count{
    background: var(--red-soft); color: var(--red); font-size:11px; font-weight:700;
    padding: 2px 8px; border-radius:999px; flex:0 0 auto;
  }

  /* --- Generic confirm modal (used for the balance-edit double-confirm) --- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,7,11,.72);
    opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:60;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .modal-box{
    background: var(--panel); border:1px solid var(--hairline); border-radius:16px;
    padding:20px; width:100%; max-width:380px;
    transform: scale(.96); transition: transform .18s ease;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.7);
  }
  .modal-backdrop.open .modal-box{ transform: scale(1); }
  .modal-box h3{ margin: 0 0 8px; }
  .balance-diff{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family: var(--display); font-size:20px; font-weight:700;
    padding: 14px 0; color: var(--text);
  }
  .balance-diff .arrow{ color: var(--text-faint); font-size:16px; }
  .balance-diff-delta{ text-align:center; font-size:13px; margin-bottom:4px; }
  .balance-diff-delta.pos{ color: var(--emerald); }
  .balance-diff-delta.neg{ color: var(--red); }

  .admin-card{ cursor:pointer; }
  .admin-card:active{ background: var(--panel-raised); }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="mark">T</span> TGSHORTBOT</div>
    <div class="topbar-right">
      <span class="role-badge" id="roleBadge">…</span>
      <button class="menu-btn" id="menuBtn" style="display:none;" aria-label="Owner settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.06a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.06a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
      </button>

<script>
(function () {
  // Optional chaining so a Telegram WebApp script that fails to load (or
  // any non-Telegram browser) never throws here — tg simply ends up null
  // and everything below degrades to the outside-Telegram landing page.
  const tg = window.Telegram?.WebApp || null;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.setHeaderColor("#12141c"); tg.setBackgroundColor("#12141c"); } catch (e) {}
  }
  // `let`, not `const` — waitForInitData() below may update this once
  // the Telegram bridge actually delivers initData (see that function's
  // comment for why a single synchronous read isn't always enough).
  let initData = window.Telegram?.WebApp?.initData || "";

  // Telegram sometimes prerenders/prefetches a Mini App in the
  // background before the user actually opens it, or the bridge script
  // is simply still connecting on a slow network — in both cases
  // initData can read as empty for a brief moment even though this is a
  // completely genuine in-Telegram session, not an outside visit. A
  // single synchronous check at load time can't tell that apart from
  // truly being outside Telegram, so instead of deciding instantly,
  // poll for up to ~1.2s for initData to show up before concluding this
  // really is an outside-Telegram visit. Real outside visits (where
  // window.Telegram never appears at all) still resolve almost
  // instantly since there's nothing to wait for.
  function waitForInitData(maxWaitMs, intervalMs) {
    return new Promise((resolve) => {
      const deadline = Date.now() + maxWaitMs;
      (function poll() {
        const fresh = window.Telegram?.WebApp?.initData || "";
        if (fresh) {
          initData = fresh;
          resolve(true);
          return;
        }
        if (Date.now() >= deadline) {
          resolve(false);
          return;
        }
        setTimeout(poll, intervalMs);
      })();
    });
  }

  const state = {
    me: null,
    tab: "overview",
    links: [],
    withdrawals: [],
    cpm: null,
    adNetworks: null,
    withdrawalsPending: [],
    adminRequestsPending: [],
    admins: [],
    stats: null,
    drawerOpen: false,
    apiKeys: [],
    analytics: null,
    platformAnalytics: null,
    platformAnalyticsFilter: { role_filter: "both", start_date: "", end_date: "" },
  };

  // ---- helpers ------------------------------------------------------

  function fmt(n) {
    return "৳" + Number(n || 0).toFixed(2);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function withdrawalsPaused() {
    return !!(state.cpm && state.cpm.withdrawals_paused);
  }

  function withdrawPausedBannerHTML() {
    if (!withdrawalsPaused()) return "";

      <div class="meta" style="color: var(--text);">⏸ ${icon("alertTriangle", 13)} Withdrawals are temporarily paused${isOwner() ? " by you" : ""}.</div>
      ${state.cpm.withdrawals_paused_message ? `<div class="meta" style="margin-top:4px;">${esc(state.cpm.withdrawals_paused_message)}</div>` : ""}
    </div>`;
  }

    checkCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>',
    clipboard: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>',
    edit: '<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>',
    trash: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>',
    eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>',
    layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline>',
    key: '<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>',
    pause: '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>',
  };

  function icon(name, size) {
    size = size || 16;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; flex:0 0 auto;">${ICON_PATHS[name] || ""}</svg>`;
  }

  function isOwner() {
    return !!(state.me && state.me.role === "owner");
  }

  // ---- Role tiers: Owner > Admin > Sub Admin > Viewer -------------------
  // Shared metadata for the role badge (top card + Admins list) and the
  // "what can I do" modal it opens when tapped.

  const ROLE_META = {
    owner: {
      label: "Owner",
      powers: [
        "প্ল্যাটফর্মের সম্পূর্ণ নিয়ন্ত্রণ — CPM, Ad Networks, User Policy",
        "সকল Admin / Sub Admin ম্যানেজ, প্রমোট/ডিমোট এবং সাসপেন্ড করা",
        "যেকোনো Sub Admin-এর জন্য আলাদা CPM ও লিংক অটো-ডিলেট সময় নির্ধারণ",
        "Admin রিকোয়েস্ট রিভিউ করে গ্রহণ বা প্রত্যাখ্যান করা",

      ],
    },
    admin: {
      label: "Admin",
      powers: [
        "লিংক তৈরি, ট্রাফিক সোর্স ম্যানেজ ও উইথড্র আবেদন",
        "প্ল্যাটফর্মের সাধারণ CPM রেটে আয়",
        "লিংকে কোনো অটো-ডিলেট সময়সীমা নেই",
      ],
    },
    sub_admin: {
      label: "Sub Admin",
      powers: [
        "লিংক তৈরি, ট্রাফিক সোর্স ম্যানেজ ও উইথড্র আবেদন",
        "Owner চাইলে আপনার জন্য আলাদা CPM রেট নির্ধারণ করতে পারেন",
        "Owner আপনার লিংকের জন্য একটি অটো-ডিলেট সময়সীমা (১/৩/৬/১২ মাস) সেট করতে পারেন",

        "Sub Admin হওয়ার পর লিংক তৈরি করে আয় শুরু করা যাবে",
      ],
    },

  const SUB_ADMIN_AUTO_DELETE_CHOICES = [1, 3, 6, 12];

  function roleMeta(role) {
    return ROLE_META[role] || ROLE_META.viewer;
  }

  // Mirrors models.effective_cpm()'s priority order client-side, for
  // showing a Sub Admin/Admin their own actual rate on their home card
  // — not the platform base rate, which per-role/per-Sub-Admin overrides
  // (Owner's CPM tab / Admins tab) may no longer match.
  function myEffectiveCpm() {
    const cs = state.cpm;
    const me = state.me;
    if (!cs || !me) return null;
    if (me.role === "sub_admin") {
      if (me.sub_admin_cpm != null) return me.sub_admin_cpm;
      if (cs.sub_admin_cpm != null) return cs.sub_admin_cpm;
    } else if (me.role === "admin" && cs.admin_cpm != null) {
      return cs.admin_cpm;
    }
    return cs.current_cpm;
  }

  function openRolePermissionsModal(role) {
    const meta = roleMeta(role);
    openModal(`
      <h3>${esc(meta.label)} — আপনার পাওয়ার</h3>
      <div class="card" style="padding:12px 14px;">
        ${meta.powers.map((p) => `<div class="meta" style="margin:6px 0;">• ${esc(p)}</div>`).join("")}
      </div>
      <div class="btn-row"><button class="btn btn-outline btn-block" id="rolePermClose">Close</button></div>
    `);
    document.getElementById("rolePermClose").addEventListener("click", closeModal);
  }

  // Mirrors storage.Storage.MIN_AD_COUNT / MAX_AD_COUNT — client-side
  // bound so a bad value is caught before the round trip, not instead of
  // the server-side check in POST /api/admin/admins/{telegram_id}/ad-count.
  const AD_COUNT_MIN = 1;
  const AD_COUNT_MAX = 10;

  // ---- Missed-earnings analytics (Anti-Abuse System read side) --------
  // Shared by the platform-wide Stats tab and the per-Admin detail view,
  // scoped by whichever `missed_earnings_trend` / `missed_earnings_by_link`
  // payload is passed in (platform-wide vs one Admin's own links).

  function missedTrendChartSVG(trend) {
    if (!trend || !trend.length) return `<div class="empty">No view history yet.</div>`;
    const W = 320, H = 110, padL = 3, padR = 3, padB = 16, padT = 6;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = trend.length;
    const gap = 2.5;
    const barW = Math.max(2, (plotW - gap * (n - 1)) / n);
    const maxVal = Math.max(1, ...trend.map((d) => d.capped_views));
    const bars = trend.map((d, i) => {
      const x = padL + i * (barW + gap);
      const h = d.capped_views > 0 ? Math.max(2, (d.capped_views / maxVal) * plotH) : 1;
      const y = padT + (plotH - h);
      const shortLabel = (d.date || "").slice(5).replace("-", "/");
      const showLabel = i === 0 || i === n - 1 || i === Math.floor(n / 2);
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"
          fill="${d.capped_views > 0 ? "var(--red)" : "var(--hairline)"}" opacity="${d.capped_views > 0 ? "0.88" : "0.6"}">
          <title>${esc(shortLabel)} — ${d.capped_views} missed view(s), ~${fmt(d.estimated_missed_amount)}</title>
        </rect>${showLabel ? `<text x="${(x + barW / 2).toFixed(1)}" y="${H - 4}" font-size="8" fill="var(--text-faint)" text-anchor="middle">${esc(shortLabel)}</text>` : ""}`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;">${bars}</svg>`;
  }

  // Generic amount-per-day bar chart — used for the platform income and
  // withdrawal trends on the Owner's Stats tab (reconciling against
  // Adsgram's own dashboard). Same layout/sizing as missedTrendChartSVG
  // above, just keyed off `amount` (a currency value) instead of a
  // capped-view count, and always drawn in `color` rather than a
  // conditional red/gray.
  function amountTrendChartSVG(trend, color) {
    if (!trend || !trend.length) return `<div class="empty">No history yet.</div>`;
    const W = 320, H = 110, padL = 3, padR = 3, padB = 16, padT = 6;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = trend.length;
    const gap = 2.5;
    const barW = Math.max(2, (plotW - gap * (n - 1)) / n);
    const maxVal = Math.max(0.01, ...trend.map((d) => d.amount));
    const bars = trend.map((d, i) => {
      const x = padL + i * (barW + gap);
      const h = d.amount > 0 ? Math.max(2, (d.amount / maxVal) * plotH) : 1;
      const y = padT + (plotH - h);
      const shortLabel = (d.date || "").slice(5).replace("-", "/");
      const showLabel = i === 0 || i === n - 1 || i === Math.floor(n / 2);
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"
          fill="${color}" opacity="${d.amount > 0 ? "0.88" : "0.35"}">
          <title>${esc(shortLabel)} — ${fmt(d.amount)}</title>
        </rect>${showLabel ? `<text x="${(x + barW / 2).toFixed(1)}" y="${H - 4}" font-size="8" fill="var(--text-faint)" text-anchor="middle">${esc(shortLabel)}</text>` : ""}`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;">${bars}</svg>`;
  }

  // Human-friendly single-date label for the chart tap-tooltip — e.g.
  // "15 Aug" from a "2026-08-15" trend-point date string. Falls back to
  // the raw string if parsing ever fails, so a malformed date can't
  // crash the tooltip.
  function prettyChartDate(dateStr) {
    try {
      return new Date(dateStr + "T00:00:00Z").toLocaleDateString("en-GB", {
        day: "numeric", month: "short", timeZone: "UTC",
      });
    } catch (e) {
      return dateStr;
    }
  }

  // Gradient-filled line chart (Obsidian-dashboard style) for the
  // Admin/Sub Admin analytics home — shared by the earning trend and
  // views trend cards in renderOverview(). `valueKey` picks which field
  // off each trend point to plot ("amount" for income_trend, "views"
  // for views_trend from GET /api/my-analytics), so one function serves
  // both charts instead of two near-duplicates. `chartId` must be
  // unique per call on the same page (it names both the <linearGradient>
  // and the wrapping/tooltip elements wireChartTooltips() below looks
  // for). `unit` is "currency" (formatted with fmt()) or "count" (shown
  // as "<n> views") — it's stamped on the wrapper as data-unit so
  // wireChartTooltips can format each chart's popup correctly without
  // needing a second parallel list of formatters.
  //
  // Each data point renders as two overlapping circles: a small filled
  // dot for visibility, and a larger transparent one on top that
  // actually receives the tap — a finger is far wider than a 2-3px dot,
  // so the real hit target needs to be bigger than what's drawn.
  function areaTrendChartSVG(trend, valueKey, color, chartId, unit) {
    if (!trend || !trend.length) return `<div class="empty">No data yet.</div>`;
    const W = 320, H = 120, padL = 4, padR = 4, padB = 18, padT = 10;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = trend.length;
    const maxVal = Math.max(0.01, ...trend.map((d) => d[valueKey] || 0));
    const stepX = n > 1 ? plotW / (n - 1) : 0;
    const points = trend.map((d, i) => {
      const x = padL + i * stepX;
      const y = padT + (plotH - ((d[valueKey] || 0) / maxVal) * plotH);
      return [x, y];
    });
    const linePath = points.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const floorY = (padT + plotH).toFixed(1);
    const areaPath = `${linePath} L${points[points.length - 1][0].toFixed(1)},${floorY} L${points[0][0].toFixed(1)},${floorY} Z`;
    const labels = trend.map((d, i) => {
      const showLabel = i === 0 || i === n - 1 || i === Math.floor(n / 2);
      if (!showLabel) return "";
      const shortLabel = (d.date || "").slice(5).replace("-", "/");
      return `<text x="${points[i][0].toFixed(1)}" y="${H - 4}" font-size="8" fill="var(--text-faint)" text-anchor="middle">${esc(shortLabel)}</text>`;
    }).join("");
    const dots = points.map((p, i) => {
      const val = trend[i][valueKey] || 0;
      const cx = p[0].toFixed(1), cy = p[1].toFixed(1);

    }).join("");
    return `<div class="chart-wrap" id="${chartId}_wrap" data-unit="${unit}">
        <div class="chart-tooltip" id="${chartId}_tip"></div>
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;">

  // One page-wide "tap outside closes any open tooltip" listener,
  // attached once regardless of how many times renderOverview() (and
  // therefore wireChartTooltips) runs — the per-dot click listeners

  // elements are discarded along with the innerHTML they lived in.
  let _chartTooltipDocListenerAdded = false;

  function wireChartTooltips(container) {
    container.querySelectorAll(".chart-wrap").forEach((wrap) => {
      const tip = wrap.querySelector(".chart-tooltip");
      const unit = wrap.dataset.unit;
      let activeDot = null;
      wrap.querySelectorAll(".chart-dot").forEach((dot) => {
        dot.addEventListener("click", (e) => {
          e.stopPropagation();
          if (activeDot === dot) {
            tip.classList.remove("show");
            activeDot = null;
            return;
          }
          activeDot = dot;
          const val = parseFloat(dot.dataset.value || "0");
          const valueLabel = unit === "currency" ? fmt(val) : `${val} views`;
          tip.innerHTML = `<b>${esc(prettyChartDate(dot.dataset.date))}</b><br>${valueLabel}`;
          const wrapRect = wrap.getBoundingClientRect();
          const dotRect = dot.getBoundingClientRect();
          tip.style.left = (dotRect.left - wrapRect.left + dotRect.width / 2) + "px";
          tip.style.top = (dotRect.top - wrapRect.top) + "px";
          tip.classList.add("show");
        });
      });
    });
    if (!_chartTooltipDocListenerAdded) {
      _chartTooltipDocListenerAdded = true;
      document.addEventListener("click", () => {
        document.querySelectorAll(".chart-tooltip.show").forEach((t) => t.classList.remove("show"));
      });
    }

  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign({ "X-Telegram-Init-Data": initData }, opts.headers || {});
    if (opts.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
    const resp = await fetch(path, Object.assign({}, opts, { headers }));
    let data = null;
    try { data = await resp.json(); } catch (e) { /* no body */ }
    if (!resp.ok) {
      const detail = (data && data.detail) || (resp.status + " " + resp.statusText);
      throw new Error(detail);
    }
    return data;
  }

  // ---- bKash/Nagad account number validation (mirrors validators.py) --

  function normalizeBDMobile(raw) {
    let s = String(raw == null ? "" : raw).replace(/[\s\-]/g, "");
    if (s.startsWith("+880")) s = "0" + s.slice(4);
    else if (s.startsWith("880") && s.length === 13) s = "0" + s.slice(3);
    return s;
  }

  function bdMobileError(raw) {
    const s = normalizeBDMobile(raw);
    if (!s) return "Account number is required.";
    if (!/^\d+$/.test(s)) return "Account number must contain digits only, e.g. 017XXXXXXXX.";
    if (s.length !== 11) return `A bKash/Nagad number must be exactly 11 digits (got ${s.length}).`;
    if (!/^01[3-9]/.test(s)) return "Enter a valid bKash/Nagad number — it must start with 013, 014, 015, 016, 017, 018 or 019.";
    return null;
  }

  // Wires an account-number <input> + adjacent <div class="field-error">
  // to validate on submit and clear the error state as the user retypes.
  function setFieldError(inputEl, errEl, message) {
    if (message) {
      inputEl.classList.add("input-error");
      errEl.textContent = message;
      errEl.classList.add("show");
    } else {
      inputEl.classList.remove("input-error");
      errEl.classList.remove("show");
    }
  }

  // ---- Copy-to-clipboard (short links) ---------------------------------

  async function copyToClipboard(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fall through to the legacy fallback below */ }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  // Finds every `.copyBtn[data-url]` inside `container` and wires a tap
  // to copy it, with a brief "Copied!" confirmation on the button itself.
  function wireCopyButtons(container) {
    container.querySelectorAll(".copyBtn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const url = btn.dataset.url || "";
        const original = btn.innerHTML;
        const ok = await copyToClipboard(url);
        if (ok) {
          btn.innerHTML = icon("checkCircle", 14) + " Copied!";
          toast("Link copied", "ok");
          setTimeout(() => { btn.innerHTML = original; }, 1500);
        } else {
          toast("Couldn't copy — long-press the link to copy manually", "err");
        }
      });
    });
  }

  function secondsToClock(s) {
    s = Math.max(0, s | 0);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return h + "h " + m + "m";
  }

  function wireTrafficSourceSection(el, prefix, afterChange) {
    let editingId = null;
    const platformSel = el.querySelector(`#${prefix}Platform`);
    const urlInput = el.querySelector(`#${prefix}Url`);
    const saveBtn = el.querySelector(`#${prefix}Save`);
    const cancelBtn = el.querySelector(`#${prefix}Cancel`);

    function setFormMode(source) {
      editingId = source ? source.id : null;
      titleEl.textContent = source ? "Edit traffic source" : "Add a traffic source";

      cancelBtn.style.display = source ? "" : "none";
      platformSel.value = source && TS_PLATFORMS.includes(source.platform) ? source.platform : "Telegram";
      urlInput.value = source ? source.url : "";

          afterChange();
        } catch (e) {

          btn.disabled = false;

      const platform = platformSel.value;

      if (!/^https?:\/\//i.test(url)) { toast("Enter a valid http(s) URL", "err"); return; }

          await api("/api/traffic-sources", { method: "POST", body: JSON.stringify({ platform, url }) });
          toast("Traffic source added", "ok");

        await loadMe();
        afterChange();
      } catch (e) {
        toast(e.message, "err");
        saveBtn.disabled = false;

  // ---- generic centered confirm modal ----------------------------------

  // Set by confirm-style helpers (see confirmDeleteLink below) right
  // before opening a modal that represents a yes/no decision — lets
  // closeModal() resolve that decision as "cancelled" when the person
  // dismisses the modal by tapping the backdrop instead of an explicit
  // button, so the calling code's `await` never hangs forever. Left
  // null by every other modal usage in this file (balance edit, admin
  // request rejection, API key display, role permissions), so this is a
  // pure no-op for all of them.
  let _pendingModalResolve = null;

  function openModal(html) {
    document.getElementById("modalBox").innerHTML = html;
    document.getElementById("modalBackdrop").classList.add("open");
  }
  function closeModal() {
    document.getElementById("modalBackdrop").classList.remove("open");
    document.getElementById("modalBox").innerHTML = "";
    if (_pendingModalResolve) {
      const resolve = _pendingModalResolve;
      _pendingModalResolve = null;
      resolve(false);
    }
  }
  document.getElementById("modalBackdrop").addEventListener("click", (e) => {
    if (e.target.id === "modalBackdrop") closeModal();
  });

  function wireAdminRequestActions(container, afterResolve) {
    container.querySelectorAll(".reqApproveBtn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await api(`/api/admin/admin-requests/${btn.dataset.id}/resolve`, { method: "POST", body: JSON.stringify({ decision: "approve" }) });
          toast("Approved — now an Admin", "ok");
          afterResolve();
        } catch (e) { toast(e.message, "err"); btn.disabled = false; }
      });
    });
    container.querySelectorAll(".reqRejectBtn").forEach((btn) => {
      btn.addEventListener("click", () => {
        openModal(`
          <h3>Reject Admin request</h3>
          <div class="meta" style="margin-bottom:8px;">A reason is required — it's sent to the Sub Admin.</div>
          <label>Reason</label>
          <input type="text" id="reqRejectReason" placeholder="e.g. traffic source too small, needs more consistent activity" autocomplete="off" />
          <div class="btn-row"><button class="btn btn-danger btn-block" id="reqRejectConfirm">Reject request</button></div>
          <div class="btn-row"><button class="btn btn-outline btn-block" id="reqRejectCancel">Cancel</button></div>
        `);
        document.getElementById("reqRejectCancel").addEventListener("click", closeModal);
        const reasonInput = document.getElementById("reqRejectReason");
        document.getElementById("reqRejectConfirm").addEventListener("click", async () => {
          const reason = reasonInput.value.trim();
          if (!reason) { toast("A reason is required", "err"); reasonInput.focus(); return; }
          const confirmBtn = document.getElementById("reqRejectConfirm");
          confirmBtn.disabled = true; confirmBtn.textContent = "Rejecting…";
          try {
            await api(`/api/admin/admin-requests/${btn.dataset.id}/resolve`, { method: "POST", body: JSON.stringify({ decision: "reject", reason }) });
            closeModal();
            toast("Request rejected", "ok");
            afterResolve();
          } catch (e) {
            toast(e.message, "err");
            confirmBtn.disabled = false; confirmBtn.textContent = "Reject request";
          }
        });
        reasonInput.focus();
      });
    });
  }

  // ---- Owner: Ad Networks (Adsgram / Monetag / GigaPub + slot order) --

  const AD_NETWORK_LABELS = { adsgram: "Adsgram", monetag: "Monetag", gigapub: "GigaPub" };

  async function renderAdNetworks(el) {
    const ans = await api("/api/ad-networks");
    state.adNetworks = ans;
    // Local working copy of the slot sequence, edited in place by the
    // controls below and only sent to the server on "Save ad order".
    let seq = (ans.slot_sequence && ans.slot_sequence.length)
      ? ans.slot_sequence.slice()
      : ["adsgram", "adsgram", "adsgram"];

    function slotRowsHTML() {
      return seq.map((net, i) => `
        <div class="btn-row" style="align-items:center;" data-slot-row="${i}">
          <label style="min-width:56px; margin:0;">Ad ${i + 1}</label>
          <select class="slotSelect" data-idx="${i}" style="flex:1;">
            ${Object.keys(AD_NETWORK_LABELS).map((k) =>
              `<option value="${k}" ${net === k ? "selected" : ""}>${AD_NETWORK_LABELS[k]}</option>`
            ).join("")}
          </select>
          ${seq.length > 1 ? `<button class="btn btn-outline btn-sm removeSlotBtn" data-idx="${i}" title="Remove this slot">${icon("trash", 14)}</button>` : ""}
        </div>
      `).join("");
    }

    function renderSlotsCard() {
      const card = el.querySelector("#slotsCard");
      card.innerHTML = `
        <h3>${icon("layers", 15)} Ad display order</h3>
        <div class="meta">Which network's ad plays for Ad 1, Ad 2, Ad 3, and so on — e.g. Adsgram,
        Monetag, GigaPub. This list is exactly how many ads every link on the platform makes a viewer
        watch — add one slot and every link is a 1-ad unlock, add three and every link is a 3-ad unlock.</div>
        <div id="slotRows">${slotRowsHTML()}</div>
        <div class="btn-row">
          <button class="btn btn-outline" id="addSlotBtn" ${seq.length >= AD_COUNT_MAX ? "disabled" : ""}>+ Add ad slot</button>
        </div>
        <div class="btn-row"><button class="btn btn-primary btn-block" id="slotsSave">Save ad order</button></div>
      `;
      card.querySelectorAll(".slotSelect").forEach((sel) => {
        sel.addEventListener("change", () => { seq[Number(sel.dataset.idx)] = sel.value; });
      });
      card.querySelectorAll(".removeSlotBtn").forEach((btn) => {
        btn.addEventListener("click", () => {
          seq.splice(Number(btn.dataset.idx), 1);
          renderSlotsCard();
        });
      });
      const addBtn = card.querySelector("#addSlotBtn");
      if (addBtn) {
        addBtn.addEventListener("click", () => {
          if (seq.length >= AD_COUNT_MAX) return;
          seq.push(seq[seq.length - 1] || "adsgram");
          renderSlotsCard();
        });
      }
      card.querySelector("#slotsSave").addEventListener("click", async () => {
        const btn = card.querySelector("#slotsSave");
        btn.disabled = true; btn.textContent = "Saving…";
        try {
          await api("/api/admin/ad-networks", { method: "POST", body: JSON.stringify({ slot_sequence: seq }) });
          toast("Ad display order updated", "ok");
          renderTab();
        } catch (e) {
          toast(e.message, "err");
        } finally {
          btn.disabled = false; btn.textContent = "Save ad order";
        }
      });
    }

    el.innerHTML = `
      <div class="card">
        <h3>${icon("settings", 15)} Ad network credentials</h3>
        <div class="meta">Fill in only the networks you've actually signed up with — leave the rest
        blank. A slot in "Ad display order" below that points at a network with no ID filled in will
        simply fail to load for viewers, the same as any other ad-load error.</div>
        <label>Adsgram Block ID</label>
        <input type="text" id="adsgramBlockId" placeholder="e.g. 12345" value="${esc(ans.adsgram_block_id)}" />
        <label style="margin-top:10px;">Monetag Zone ID</label>
        <input type="text" id="monetagZoneId" placeholder="e.g. 123456" value="${esc(ans.monetag_zone_id)}" />
        <label>Monetag SDK script URL</label>
        <input type="text" id="monetagSdkUrl" placeholder="https://…/sdk.js" value="${esc(ans.monetag_sdk_url)}" />
        <div class="meta">Monetag personalizes this script's domain per zone for anti-adblock reasons —
        copy the full <code>src</code> URL exactly from your Monetag dashboard's "Get SDK" → Rewarded
        Interstitial tag, rather than typing it from memory.</div>
        <label style="margin-top:10px;">GigaPub Project ID</label>
        <input type="text" id="gigapubProjectId" placeholder="e.g. your-project-id" value="${esc(ans.gigapub_project_id)}" />
        <div class="btn-row"><button class="btn btn-primary btn-block" id="credsSave">Save credentials</button></div>
      </div>
      <div class="card" id="slotsCard"></div>
    `;

    el.querySelector("#credsSave").addEventListener("click", async () => {
      const btn = el.querySelector("#credsSave");
      const adsgram_block_id = el.querySelector("#adsgramBlockId").value.trim();
      const monetag_zone_id = el.querySelector("#monetagZoneId").value.trim();
      const monetag_sdk_url = el.querySelector("#monetagSdkUrl").value.trim();
      const gigapub_project_id = el.querySelector("#gigapubProjectId").value.trim();
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        await api("/api/admin/ad-networks", {
          method: "POST",
          body: JSON.stringify({ adsgram_block_id, monetag_zone_id, monetag_sdk_url, gigapub_project_id }),
        });
        toast("Ad network credentials updated", "ok");
        renderTab();
      } catch (e) {
        toast(e.message, "err");
      } finally {
        btn.disabled = false; btn.textContent = "Save credentials";
      }
    });

    renderSlotsCard();
  }

        <div class="stat-box"><div class="n">${fmt(d.total_withdrawn)}</div><div class="l">Total withdrawn</div></div>
        <div class="stat-box"><div class="n">${d.pending_views}${d.pending_views ? ` (~${fmt(d.estimated_pending_amount)})` : ""}</div><div class="l">Pending views</div></div>
        <div class="stat-box"><div class="n">${d.pending_withdrawal_count}${d.pending_withdrawal_count ? ` (${fmt(d.pending_withdrawal_amount)})` : ""}</div><div class="l">Pending withdrawals</div></div>
        <div class="stat-box"><div class="n">${d.total_links}</div><div class="l">Total links</div></div>
        <div class="stat-box"><div class="n">${d.total_views}</div><div class="l">Total views</div></div>
        <div class="stat-box"><div class="n">${d.daily_capped_views}</div><div class="l">Daily-capped views</div></div>
      </div>

      <div class="section-title" style="margin-top:14px;">${icon("alertTriangle", 14)} Missed earnings trend (last 14 days)</div>
      <div class="card">
        <div class="meta" style="margin-bottom:6px;">This Admin's views excluded from earnings by the daily anti-abuse cap, day by day.</div>
        ${missedTrendChartSVG(d.missed_earnings_trend)}
      </div>

      ${d.missed_earnings_by_link && d.missed_earnings_by_link.length ? `
        <div class="section-title" style="margin-top:14px;">${icon("link", 14)} Links with missed views</div>
        <div>${missedByLinkListHTML(d.missed_earnings_by_link, { showOwner: false })}</div>
      ` : ""}

      <div class="section-title" style="margin-top:14px;">${icon("play", 14)} Ad count override</div>
      <div class="card">
        <div class="meta">${a.ad_count != null ? `Currently showing <b style="color:var(--text)">${a.ad_count}</b> ad${a.ad_count === 1 ? "" : "s"} to unlock every link this ${esc(roleMeta(a.role).label)} owns.` : "Currently following the platform-wide ad display order (Ad Networks tab)."}</div>
        <label>Custom ad count (leave blank to use the platform default)</label>
        <input type="number" id="adminAdCountInput" min="${AD_COUNT_MIN}" max="${AD_COUNT_MAX}" step="1" value="${a.ad_count != null ? a.ad_count : ""}" placeholder="Platform default" />
        <div class="meta" style="color:var(--text-faint);">Applies instantly to every link this ${esc(roleMeta(a.role).label)} already has, and every new one — no need to set it per link.</div>
        <div class="btn-row"><button class="btn btn-primary btn-block" id="adminAdCountSaveBtn">Save ad count</button></div>
      </div>
      <div id="adminLinksList">${adminLinksListHTML(adminLinks)}</div>

      ${a.admin_request_status === "pending" ? `
        <div class="section-title" style="margin-top:14px;">${icon("trendingUp", 14)} Pending Admin request</div>
        <div id="detailAdminRequest">${adminRequestCardHTML({ admin: a, total_links: d.total_links, total_views: d.total_views, lifetime_income: d.lifetime_income })}</div>
      ` : a.admin_request_status === "rejected" ? `
        <div class="section-title" style="margin-top:14px;">${icon("trendingUp", 14)} Admin request</div>
        <div class="card"><div class="meta" style="color:var(--red);">Last request was rejected. Reason: ${esc(a.admin_request_reason || "—")}</div></div>
      ` : ""}

      <div class="section-title" style="margin-top:14px;">${icon("users", 14)} Role</div>
      <div class="card">
        <div class="meta">Current: <span class="pill ${a.role}">${esc(roleMeta(a.role).label)}</span></div>
        <label>Change role</label>
        <select id="roleSelect">
          <option value="admin"${a.role === "admin" ? " selected" : ""}>Admin</option>
          <option value="sub_admin"${a.role === "sub_admin" ? " selected" : ""}>Sub Admin</option>
          <option value="viewer"${a.role === "viewer" ? " selected" : ""}>Viewer</option>
        </select>
        <div class="btn-row"><button class="btn btn-primary btn-block" id="roleSaveBtn">Update role</button></div>
        ${a.role === "sub_admin" ? "" : `<div class="meta" style="margin-top:6px; color:var(--text-faint);">Demoting out of Sub Admin clears any custom CPM/auto-delete setting below.</div>`}
      </div>

      ${a.role === "sub_admin" ? `
        <div class="section-title" style="margin-top:14px;">${icon("trendingUp", 14)} Sub Admin CPM override</div>
        <div class="card">
          <div class="meta">${a.sub_admin_cpm != null ? `Currently using a custom rate: <b style="color:var(--text)">${fmt(a.sub_admin_cpm)}</b> per view.` : "Currently using the platform-wide CPM rate."}</div>
          <label>Custom CPM (leave blank to use the platform rate)</label>
          <input type="number" id="subAdminCpmInput" min="0" step="0.0001" value="${a.sub_admin_cpm != null ? a.sub_admin_cpm : ""}" placeholder="Platform rate" />
          <div class="btn-row"><button class="btn btn-primary btn-block" id="subAdminCpmSaveBtn">Save CPM</button></div>
        </div>

        <div class="section-title" style="margin-top:14px;">${icon("clock", 14)} Link auto-delete</div>
        <div class="card">
          <div class="meta">${a.link_auto_delete_months ? `New links auto-delete after <b style="color:var(--text)">${a.link_auto_delete_months} months</b>.` : "New links never auto-delete."} Applies to new links only, not existing ones. The Sub Admin is DM'd about any change.</div>
          <label>Auto-delete window</label>
          <select id="autoDeleteSelect">
            <option value="0"${!a.link_auto_delete_months ? " selected" : ""}>Never</option>
            ${SUB_ADMIN_AUTO_DELETE_CHOICES.map((m) => `<option value="${m}"${a.link_auto_delete_months === m ? " selected" : ""}>${m} months</option>`).join("")}
          </select>
          <div class="btn-row"><button class="btn btn-primary btn-block" id="autoDeleteSaveBtn">Save auto-delete</button></div>
        </div>
      ` : ""}

      <div class="card">
        <h3>Traffic Sources</h3>
        ${(a.traffic_sources && a.traffic_sources.length)
          ? a.traffic_sources.map((s) => `<div class="meta">${esc(s.platform)}: <a href="${esc(s.url)}" target="_blank" style="color:var(--brass);">${esc(s.url)}</a></div>`).join("")
          : `<div class="meta" style="color:var(--text-faint);">No Traffic Source on file</div>`}
      </div>

      <div class="card">
        <h3>Edit balance</h3>
        <div class="meta">Current confirmed balance: <b style="color:var(--text)">${fmt(a.balance_confirmed)}</b>. This is a manual correction — it's logged below, and the Admin is not notified.</div>
        <label>New balance</label>
        <input type="number" id="editBalanceInput" min="0" step="0.01" value="${a.balance_confirmed}" />
        <label>Reason (optional)</label>
        <input type="text" id="editBalanceReason" placeholder="e.g. correcting a duplicate-view credit" />
        <div class="btn-row"><button class="btn btn-primary btn-block" id="editBalanceBtn">Update balance</button></div>
      </div>

      <div class="section-title" style="margin-top:14px;">Balance adjustment history</div>
      <div id="balanceHistory">
        ${d.balance_adjustments.length
          ? d.balance_adjustments.map((h) => `
              <div class="card">
                <div class="meta">${fmt(h.detail.old_balance)} → <b style="color:var(--text)">${fmt(h.detail.new_balance)}</b></div>
                ${h.detail.reason ? `<div class="meta">Reason: ${esc(h.detail.reason)}</div>` : ""}
                <div class="meta" style="color:var(--text-faint);">${esc((h.created_at || "").replace("T", " ").slice(0, 19))} UTC</div>
              </div>
            `).join("")
          : `<div class="card"><div class="empty">No balance corrections yet.</div></div>`}
      </div>
    `;

    el.querySelector("#backToAdmins").addEventListener("click", () => renderAdmins(el));
    wireChartTooltips(el);

    const detailReqEl = el.querySelector("#detailAdminRequest");
    if (detailReqEl) wireAdminRequestActions(detailReqEl, () => renderAdminDetail(el, telegramId));

    const roleSaveBtn = el.querySelector("#roleSaveBtn");
    if (roleSaveBtn) {
      roleSaveBtn.addEventListener("click", async () => {
        const newRole = el.querySelector("#roleSelect").value;
        if (newRole === a.role) { toast("That's already their role", "err"); return; }
        roleSaveBtn.disabled = true; roleSaveBtn.textContent = "Updating…";
        try {
          await api(`/api/admin/admins/${telegramId}/role`, { method: "POST", body: JSON.stringify({ role: newRole }) });
          toast("Role updated", "ok");
          renderAdminDetail(el, telegramId);
        } catch (e) {
          toast(e.message, "err");
          roleSaveBtn.disabled = false; roleSaveBtn.textContent = "Update role";
        }
      });
    }

    const cpmSaveBtn = el.querySelector("#subAdminCpmSaveBtn");
    if (cpmSaveBtn) {
      cpmSaveBtn.addEventListener("click", async () => {
        const raw = el.querySelector("#subAdminCpmInput").value.trim();
        const cpm = raw === "" ? null : parseFloat(raw);
        if (cpm !== null && !(cpm >= 0)) { toast("Enter a valid CPM (0 or more), or leave it blank", "err"); return; }
        cpmSaveBtn.disabled = true; cpmSaveBtn.textContent = "Saving…";
        try {
          await api(`/api/admin/admins/${telegramId}/sub-admin-cpm`, { method: "POST", body: JSON.stringify({ cpm }) });
          toast("CPM updated — they've been notified", "ok");
          renderAdminDetail(el, telegramId);
        } catch (e) {
          toast(e.message, "err");
          cpmSaveBtn.disabled = false; cpmSaveBtn.textContent = "Save CPM";
        }
      });
    }

    const adCountSaveBtn = el.querySelector("#adminAdCountSaveBtn");
    if (adCountSaveBtn) {
      adCountSaveBtn.addEventListener("click", async () => {
        const raw = el.querySelector("#adminAdCountInput").value.trim();
        const ad_count = raw === "" ? null : parseInt(raw, 10);
        if (ad_count !== null && (!Number.isFinite(ad_count) || ad_count < AD_COUNT_MIN || ad_count > AD_COUNT_MAX)) {
          toast(`Ad count must be between ${AD_COUNT_MIN} and ${AD_COUNT_MAX}, or left blank`, "err");
          return;
        }
        adCountSaveBtn.disabled = true; adCountSaveBtn.textContent = "Saving…";
        try {
          await api(`/api/admin/admins/${telegramId}/ad-count`, { method: "POST", body: JSON.stringify({ ad_count }) });
          toast("Ad count updated — they've been notified", "ok");
          renderAdminDetail(el, telegramId);
        } catch (e) {
          toast(e.message, "err");
          adCountSaveBtn.disabled = false; adCountSaveBtn.textContent = "Save ad count";
        }
      });
    }

    const autoDeleteSaveBtn = el.querySelector("#autoDeleteSaveBtn");
    if (autoDeleteSaveBtn) {
      autoDeleteSaveBtn.addEventListener("click", async () => {
        const months = parseInt(el.querySelector("#autoDeleteSelect").value, 10) || null;
        autoDeleteSaveBtn.disabled = true; autoDeleteSaveBtn.textContent = "Saving…";
        try {
          await api(`/api/admin/admins/${telegramId}/auto-delete`, { method: "POST", body: JSON.stringify({ months }) });
          toast("Auto-delete setting updated — they've been notified", "ok");
          renderAdminDetail(el, telegramId);
        } catch (e) {
          toast(e.message, "err");
          autoDeleteSaveBtn.disabled = false; autoDeleteSaveBtn.textContent = "Save auto-delete";
        }
      });
    }

    el.querySelector("#editBalanceBtn").addEventListener("click", () => {
      const newBalanceRaw = el.querySelector("#editBalanceInput").value;
      const reason = el.querySelector("#editBalanceReason").value.trim();
      const newBalance = parseFloat(newBalanceRaw);
      if (!(newBalance >= 0)) { toast("Enter a valid balance (0 or more)", "err"); return; }
      const oldBalance = a.balance_confirmed;
      if (Math.abs(newBalance - oldBalance) < 0.0000001) { toast("That's already the current balance", "err"); return; }
      const delta = newBalance - oldBalance;

      openModal(`
        <h3>Confirm balance change</h3>
        <div class="balance-diff">
          <span>${fmt(oldBalance)}</span><span class="arrow">→</span><span>${fmt(newBalance)}</span>
        </div>
        <div class="balance-diff-delta ${delta > 0 ? "pos" : "neg"}">${delta > 0 ? "+" : ""}${fmt(delta)}</div>
        ${reason ? `<div class="meta" style="text-align:center; margin-bottom:10px;">Reason: ${esc(reason)}</div>` : ""}
        <div class="meta" style="margin-top:10px;">This can't be undone automatically. Type <b style="color:var(--text)">CONFIRM</b> below to apply it.</div>
        <input type="text" id="confirmText" placeholder="Type CONFIRM" style="margin-top:8px;" autocomplete="off" />
        <div class="btn-row">
          <button class="btn btn-primary btn-block" id="confirmApply" disabled>Apply change</button>
        </div>
        <div class="btn-row"><button class="btn btn-outline btn-block" id="confirmCancel">Cancel</button></div>
      `);

      const confirmInput = document.getElementById("confirmText");
      const applyBtn = document.getElementById("confirmApply");
      confirmInput.addEventListener("input", () => {
        applyBtn.disabled = confirmInput.value !== "CONFIRM";
      });
      document.getElementById("confirmCancel").addEventListener("click", closeModal);
      applyBtn.addEventListener("click", async () => {
        applyBtn.disabled = true;
        applyBtn.textContent = "Applying…";
        try {
          await api(`/api/admin/admins/${telegramId}/balance`, {
            method: "POST",
            body: JSON.stringify({ new_balance: newBalance, reason: reason || null, confirm_text: "CONFIRM" }),
          });
          closeModal();
          toast("Balance updated", "ok");
          renderAdminDetail(el, telegramId);
        } catch (e) {
          toast(e.message, "err");
          applyBtn.disabled = false;
          applyBtn.textContent = "Apply change";
        }
      });
      confirmInput.focus();
    });
  }

  // ---- Owner: Stats -----------------------------------------------------

  async function renderStats(el) {
    const s = await api("/api/admin/stats");
    state.stats = s;
    el.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${s.total_admins}</div><div class="l">Admins</div></div>
        <div class="stat-box"><div class="n">${s.total_links}</div><div class="l">Links</div></div>
        <div class="stat-box"><div class="n">${s.total_views}</div><div class="l">Total views</div></div>
        <div class="stat-box"><div class="n">${s.pending_payout_views}</div><div class="l">Pending views</div></div>
        <div class="stat-box"><div class="n">${s.daily_capped_views}</div><div class="l">Daily-capped views</div></div>
        <div class="stat-box"><div class="n">${fmt(s.total_confirmed_liability)}</div><div class="l">Confirmed liability</div></div>
      </div>

      <div class="section-title" style="margin-top:14px;">${icon("trendingUp", 14)} Income (all admins combined)</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${fmt(s.today_income)}</div><div class="l">Today</div></div>
        <div class="stat-box"><div class="n">${fmt(s.income_last_7_days)}</div><div class="l">Last 7 days</div></div>
        <div class="stat-box"><div class="n">${fmt(s.income_last_30_days)}</div><div class="l">Last 30 days</div></div>
        <div class="stat-box"><div class="n">${fmt(s.lifetime_income)}</div><div class="l">Lifetime</div></div>
      </div>
      <div class="card">
        <div class="meta" style="margin-bottom:6px;">Total credited to every Admin/Sub Admin, day by day — the CPM side of the ledger. Compare this against your Adsgram dashboard's revenue for the same days to see profit or loss.</div>
        ${amountTrendChartSVG(s.income_trend, "var(--emerald)")}
      </div>

      <div class="section-title" style="margin-top:14px;">${icon("banknote", 14)} Withdrawn (all admins combined)</div>
      <div class="stat-grid stat-grid-3">
        <div class="stat-box"><div class="n">${fmt(s.withdrawn_last_7_days)}</div><div class="l">Last 7 days</div></div>
        <div class="stat-box"><div class="n">${fmt(s.withdrawn_last_30_days)}</div><div class="l">Last 30 days</div></div>
        <div class="stat-box"><div class="n">${fmt(s.total_paid_out)}</div><div class="l">Lifetime paid out</div></div>
      </div>
      <div class="card">
        <div class="meta" style="margin-bottom:6px;">Money actually paid out (status: Paid), grouped by the day it was marked paid — not the day it was requested.</div>
        ${amountTrendChartSVG(s.withdrawn_trend, "var(--brass)")}
      </div>

      <div class="section-title" style="margin-top:14px;">${icon("alertTriangle", 14)} Missed earnings trend (last 14 days)</div>
      <div class="card">
        <div class="meta" style="margin-bottom:6px;">Views watched but excluded from earnings by the daily anti-abuse cap, day by day — a rising bar chain means abuse is trending up, not just a one-off spike.</div>
        ${missedTrendChartSVG(s.missed_earnings_trend)}
      </div>

      ${suggestedLimitCardHTML(s.suggested_daily_limit)}

      <div class="section-title" style="margin-top:14px;">${icon("link", 14)} Top links by missed views</div>
      <div id="missedByLink">${missedByLinkListHTML(s.missed_earnings_by_link, { showOwner: true })}</div>
    `;
    const applyBtn = el.querySelector("#applySuggestedLimit");
    if (applyBtn) {
      applyBtn.addEventListener("click", async () => {
        const newLimit = s.suggested_daily_limit.suggested_limit;
        applyBtn.disabled = true;
        applyBtn.textContent = "Applying…";
        try {
          await api("/api/admin/cpm", { method: "POST", body: JSON.stringify({ max_daily_views_per_admin: newLimit }) });
          if (state.cpm) state.cpm.max_daily_views_per_admin = newLimit;
          toast(`Daily view limit set to ${newLimit}`, "ok");
          renderStats(el);
        } catch (e) {
          toast(e.message, "err");
          applyBtn.disabled = false;
          applyBtn.textContent = `Apply suggested limit (${newLimit})`;
        }
      });
    }
    renderTopCard();
  }

  // ---- outside-Telegram fallback --------------------------------------
  // No initData means: a real browser visit, a link preview, or an
  // ad-network moderator opening the raw URL directly — there's no
  // reliable client-side way to tell those apart, and there doesn't need
  // to be, since this page is safe for anyone to see. Rather than block
  // or show a bare error, it shows a small branded landing page so a
  // moderator (or anyone else) can visually confirm the app is alive and
  // intentional, with a clear path into the real dashboard via Telegram.
  function renderOutsideTelegram() {
    document.getElementById("app").innerHTML = `
      <div class="landing">
        <div class="landing-mark">T</div>
        <h1>TGSHORTBOT</h1>
        <p>A Telegram-based ad-locked URL shortener and earning platform — share links, viewers watch a few ads, everyone earns.</p>
        <a class="btn btn-primary" href="https://t.me/__BOT_USERNAME__">Open in Telegram</a>
        <a class="landing-privacy" href="/privacy" target="_blank" rel="noopener">Privacy Policy &amp; Terms</a>
      </div>`;
  }

  // ---- data loaders ---------------------------------------------------

  async function loadMe() { state.me = await api("/api/me"); }
  async function loadLinks() { const d = await api("/api/links"); state.links = d.links; }
  async function loadMyAnalytics() { state.analytics = await api("/api/my-analytics"); }
  async function loadPlatformAnalytics() {
    const f = state.platformAnalyticsFilter;
    const params = new URLSearchParams();
    params.set("role_filter", f.role_filter || "both");
    if (f.start_date) params.set("start_date", f.start_date);
    if (f.end_date) params.set("end_date", f.end_date);
    state.platformAnalytics = await api(`/api/admin/analytics?${params.toString()}`);
  }
  async function loadMyWithdrawals() { const d = await api("/api/withdrawals/mine"); state.withdrawals = d.withdrawals; }
  async function loadCpm() { state.cpm = await api("/api/cpm"); }
  async function loadOwnerWithdrawals() { const d = await api("/api/admin/withdrawals"); state.withdrawalsPending = d.withdrawals; }
  async function loadAdminRequests() { const d = await api("/api/admin/admin-requests"); state.adminRequestsPending = d.requests; }
  async function loadStats() { state.stats = await api("/api/admin/stats"); }

  async function init() {
    if (!initData) {
      // Give the Telegram bridge a brief window to catch up before
      // concluding this is genuinely outside Telegram (see
      // waitForInitData's comment above for why this matters).
      await waitForInitData(1200, 50);
    }
    if (!initData) {
      renderOutsideTelegram();
      return;
    }
    try {
      await loadMe();
      if (isOwner()) {
        await Promise.all([loadCpm(), loadOwnerWithdrawals(), loadStats(), loadAdminRequests()]);
      } else {
        await Promise.all([loadLinks(), loadCpm()]);
      }
      renderTopCard();
      renderDrawer();
      renderTab();
    } catch (e) {
      document.getElementById("app").innerHTML = `<div class="card" style="margin-top:40px;"><div class="empty">Couldn't load your dashboard — ${esc(e.message)}</div></div>`;
    }
  }

  init();
})();
</script>
</body>
</html>
