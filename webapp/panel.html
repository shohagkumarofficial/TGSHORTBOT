<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>TGSHORTBOT Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141c;
    --panel: #1a1e2a;
    --panel-raised: #212637;
    --hairline: #2b3040;
    --brass: #d9a441;
    --brass-soft: rgba(217,164,65,.14);
    --emerald: #3fbf7f;
    --emerald-soft: rgba(63,191,127,.14);
    --red: #e2685c;
    --red-soft: rgba(226,104,92,.14);
    --violet: #9c8cf2;
    --violet-soft: rgba(156,140,242,.14);
    --text: #f1ede4;
    --text-dim: #9aa0b4;
    --text-faint: #5c6278;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    -webkit-tap-highlight-color: transparent;
  }
  #app{ padding: 16px 16px 90px; max-width: 640px; margin: 0 auto; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px;
  }
  .brand{
    font-family: var(--display); font-weight:700; font-size:17px; letter-spacing:-.01em;
    display:flex; align-items:center; gap:8px;
  }
  .brand .mark{
    width:26px; height:26px; border-radius:8px;
    background: linear-gradient(145deg, #e7bb63, var(--brass));
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:#12141c;
  }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .role-badge{
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    padding: 5px 10px; border-radius: 999px;
    background: var(--panel-raised); color: var(--text-dim);
    border: 1px solid var(--hairline);
  }
  .role-badge.owner{ color: var(--violet); border-color: rgba(156,140,242,.35); background: var(--violet-soft); }

  .menu-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--hairline);
    background: var(--panel-raised); color: var(--text); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
    position:relative;
  }
  .menu-btn .dot{
    position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%;
    background: var(--red); border:2px solid var(--bg); display:none;
  }
  .menu-btn .dot.show{ display:block; }

  .balance-card{
    background: linear-gradient(160deg, var(--panel-raised), var(--panel));
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .balance-card.owner-card{
    background: linear-gradient(160deg, rgba(156,140,242,.10), var(--panel));
    border-color: rgba(156,140,242,.25);
  }
  .balance-row{ display:flex; gap: 22px; }
  .balance-item .label{ font-size:11px; color: var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .balance-item .value{ font-family: var(--display); font-weight:700; font-size:24px; }
  .balance-item.confirmed .value{ color: var(--emerald); }
  .balance-item.pending .value{ color: var(--brass); }
  .balance-item.violet .value{ color: var(--violet); }
  .cycle-note{ margin-top:14px; font-size:12px; color: var(--text-dim); border-top:1px solid var(--hairline); padding-top:12px; }
  .cycle-note b{ color: var(--text); }
  .owner-eyebrow{
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--violet);
    margin-bottom: 12px; font-weight:700;
  }

  .tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom: 16px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex: 0 0 auto;
    display:flex; align-items:center; gap:6px;
    font-family: var(--body); font-weight:600; font-size:13px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--hairline);
    padding: 9px 16px; border-radius: 999px; cursor:pointer;
    white-space: nowrap;
  }
  .tab-btn.active{
    color:#12141c; background: var(--brass); border-color: var(--brass);
  }
  .tab-badge{
    background: var(--red); color:#fff; font-size:10.5px; font-weight:700;
    min-width:16px; height:16px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    padding: 0 4px;
  }
  .tab-btn.active .tab-badge{ background:#12141c; color:var(--brass); }

  .card{
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h3{
    font-family: var(--display); font-size:14px; margin: 0 0 4px; letter-spacing:-.01em;
  }
  .card .meta{ font-size:12px; color: var(--text-dim); margin-bottom:10px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .pill{
    display:inline-flex; align-items:center; font-size:11px; font-weight:600;
    padding: 3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em;
  }
  .pill.pending{ background: var(--brass-soft); color: var(--brass); }
  .pill.paid{ background: var(--emerald-soft); color: var(--emerald); }
  .pill.rejected{ background: var(--red-soft); color: var(--red); }
  .pill.active{ background: var(--emerald-soft); color: var(--emerald); }
  .pill.banned{ background: var(--red-soft); color: var(--red); }
  .pill.owner{ background: var(--violet-soft); color: var(--violet); }

  code.short-url{
    display:block; font-size: 12.5px; color: var(--text); background: var(--panel-raised);
    padding: 8px 10px; border-radius: 10px; margin: 8px 0; word-break: break-all;
    border: 1px solid var(--hairline);
  }

  label{ display:block; font-size:12px; color: var(--text-dim); margin: 12px 0 6px; }
  input[type=text], input[type=number], input[type=url], select{
    width:100%; background: var(--panel-raised); border: 1px solid var(--hairline);
    color: var(--text); font-family: var(--body); font-size:14px;
    padding: 11px 12px; border-radius: 10px; outline:none;
  }
  input:focus, select:focus{ border-color: var(--brass); }

  .btn{
    font-family: var(--body); font-weight:600; font-size:13.5px;
    border-radius: 10px; padding: 10px 16px; cursor:pointer; border: none;
  }
  .btn-primary{ background: var(--brass); color:#12141c; }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  .btn-outline{ background:none; border:1px solid var(--hairline); color: var(--text); }
  .btn-danger{ background: var(--red-soft); color: var(--red); border:1px solid rgba(226,104,92,.3); }
  .btn-success{ background: var(--emerald-soft); color: var(--emerald); border:1px solid rgba(63,191,127,.3); }
  .btn-sm{ padding: 7px 12px; font-size:12.5px; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:8px; margin-top:10px; }

  .empty{
    text-align:center; padding: 34px 12px; color: var(--text-faint); font-size:13px;
  }

  .toast{
    position:fixed; left:50%; bottom:20px; transform: translateX(-50%) translateY(20px);
    background: var(--panel-raised); border:1px solid var(--hairline); color: var(--text);
    padding: 11px 18px; border-radius: 999px; font-size: 13px;
    opacity:0; transition: opacity .25s ease, transform .25s ease;
    pointer-events:none; z-index: 60; max-width: 90%; text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
  .toast.err{ border-color: rgba(226,104,92,.4); color: var(--red); }
  .toast.ok{ border-color: rgba(63,191,127,.4); color: var(--emerald); }

  .skel{ background: linear-gradient(90deg, var(--panel-raised) 25%, var(--hairline) 37%, var(--panel-raised) 63%); background-size: 400% 100%; animation: shimmer 1.3s ease infinite; border-radius: 8px; }
  @keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:0 0} }

  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .stat-box{ background: var(--panel-raised); border:1px solid var(--hairline); border-radius:12px; padding:14px; }
  .stat-box .n{ font-family: var(--display); font-weight:700; font-size:22px; }
  .stat-box .l{ font-size:11px; color: var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  .section-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.1em; color: var(--text-faint);
    margin: 4px 0 10px;
  }

  /* --- Owner drawer / bottom sheet --- */
  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(6,7,11,.6);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:40;
  }
  .drawer-backdrop.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; left:0; right:0; bottom:0;
    background: var(--panel);
    border-top: 1px solid var(--hairline);
    border-radius: 20px 20px 0 0;
    padding: 10px 10px calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateY(105%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 41;
    max-width: 640px; margin: 0 auto;
    box-shadow: 0 -20px 50px -20px rgba(0,0,0,.6);
  }
  .drawer.open{ transform: translateY(0); }
  .drawer-handle{ width:36px; height:4px; border-radius:2px; background:var(--hairline); margin: 6px auto 10px; }
  .drawer-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.1em; color: var(--text-faint);
    padding: 4px 10px 8px;
  }
  .drawer-item{
    display:flex; align-items:center; gap:12px;
    padding: 12px 10px; border-radius: 12px; cursor:pointer;
  }
  .drawer-item:active{ background: var(--panel-raised); }
  .drawer-item .ic{
    width:36px; height:36px; border-radius:10px; background: var(--panel-raised);
    display:flex; align-items:center; justify-content:center; font-size:17px; flex:0 0 auto;
  }
  .drawer-item .label-col{ flex:1; }
  .drawer-item .t{ font-size:14px; font-weight:600; color: var(--text); }
  .drawer-item .s{ font-size:11.5px; color: var(--text-dim); margin-top:1px; }
  .drawer-item .badge-count{
    background: var(--red-soft); color: var(--red); font-size:11px; font-weight:700;
    padding: 2px 8px; border-radius:999px; flex:0 0 auto;
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="mark">T</span> TGSHORTBOT</div>
    <div class="topbar-right">
      <span class="role-badge" id="roleBadge">…</span>
      <button class="menu-btn" id="menuBtn" style="display:none;">⋮<span class="dot" id="menuDot"></span></button>
    </div>
  </div>

  <div class="balance-card" id="topCard"><div class="skel" style="height:60px;"></div></div>

  <div class="tabs" id="tabs"></div>
  <div id="tabContent"></div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">More</div>
  <div id="drawerItems"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor("#12141c"); tg.setBackgroundColor("#12141c"); } catch (e) {}
  }
  const initData = tg ? tg.initData : "";

  const state = {
    me: null,
    tab: "overview",
    links: [],
    withdrawals: [],
    cpm: null,
    withdrawalsPending: [],
    admins: [],
    stats: null,
    drawerOpen: false,
  };

  // ---- helpers ------------------------------------------------------

  function fmt(n) {
    return "৳" + Number(n || 0).toFixed(2);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function isOwner() {
    return !!(state.me && state.me.role === "owner");
  }

  let toastTimer = null;
  function toast(msg, kind) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = "toast"; }, 2600);
  }

  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign({ "X-Telegram-Init-Data": initData }, opts.headers || {});
    if (opts.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
    const resp = await fetch(path, Object.assign({}, opts, { headers }));
    let data = null;
    try { data = await resp.json(); } catch (e) { /* no body */ }
    if (!resp.ok) {
      const detail = (data && data.detail) || (resp.status + " " + resp.statusText);
      throw new Error(detail);
    }
    return data;
  }

  function secondsToClock(s) {
    s = Math.max(0, s | 0);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return h + "h " + m + "m";
  }

  // ---- navigation: primary tabs (role-aware) + owner drawer -----------

  function primaryTabs() {
    if (isOwner()) {
      return [
        ["overview", "Overview", 0],
        ["payouts", "Withdrawals", state.withdrawalsPending.length],
        ["admins", "Admins", 0],
      ];
    }
    return [
      ["overview", "Overview", 0],
      ["links", "My Links", 0],
      ["traffic", "Traffic Source", 0],
      ["withdraw", "Withdraw", 0],
    ];
  }

  function drawerItems() {
    if (!isOwner()) return [];
    return [
      ["links", "🔗", "My Links", "Create & manage your own short links"],
      ["traffic", "📡", "Traffic Source", "Set where your own links get shared"],
      ["withdraw", "💸", "Request Withdrawal", "Cash out your own confirmed balance"],
      ["cpm", "⚙️", "CPM Settings", "Real-time / Scheduled mode, rate, cycle"],
      ["stats", "📈", "Platform Stats", "Totals across every admin"],
    ];
  }

  function renderTabs() {
    const el = document.getElementById("tabs");
    el.innerHTML = primaryTabs().map(([id, label, badge]) =>
      `<button class="tab-btn${state.tab === id ? " active" : ""}" data-tab="${id}">${label}${badge ? `<span class="tab-badge">${badge}</span>` : ""}</button>`
    ).join("");
    el.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => { state.tab = btn.dataset.tab; renderTab(); });
    });

    const menuBtn = document.getElementById("menuBtn");
    const dot = document.getElementById("menuDot");
    if (isOwner()) {
      menuBtn.style.display = "flex";
      dot.className = "dot" + (state.withdrawalsPending.length > 0 ? " show" : "");
    } else {
      menuBtn.style.display = "none";
    }
  }

  function renderDrawer() {
    const el = document.getElementById("drawerItems");
    el.innerHTML = drawerItems().map(([id, icon, title, sub]) => `
      <div class="drawer-item" data-tab="${id}">
        <div class="ic">${icon}</div>
        <div class="label-col"><div class="t">${title}</div><div class="s">${sub}</div></div>
      </div>
    `).join("");
    el.querySelectorAll(".drawer-item").forEach((item) => {
      item.addEventListener("click", () => {
        state.tab = item.dataset.tab;
        closeDrawer();
        renderTab();
      });
    });
  }

  function openDrawer() {
    state.drawerOpen = true;
    document.getElementById("drawerBackdrop").classList.add("open");
    document.getElementById("drawer").classList.add("open");
  }
  function closeDrawer() {
    state.drawerOpen = false;
    document.getElementById("drawerBackdrop").classList.remove("open");
    document.getElementById("drawer").classList.remove("open");
  }

  document.getElementById("menuBtn").addEventListener("click", () => {
    state.drawerOpen ? closeDrawer() : openDrawer();
  });
  document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);

  // ---- top card: admin balance card vs owner business snapshot --------

  function renderTopCard() {
    const card = document.getElementById("topCard");
    const badge = document.getElementById("roleBadge");
    if (!state.me) { card.innerHTML = `<div class="skel" style="height:60px;"></div>`; return; }

    badge.textContent = isOwner() ? "Owner" : "Admin";
    badge.className = "role-badge" + (isOwner() ? " owner" : "");

    if (isOwner()) {
      const pendingCount = state.withdrawalsPending.length;
      const pendingSum = state.withdrawalsPending.reduce((s, w) => s + w.amount, 0);
      const cpmLine = state.cpm
        ? (state.cpm.mode === "scheduled"
            ? `Scheduled · next cycle in <b>${secondsToClock(state.cpm.seconds_to_payout)}</b>`
            : `Real-time · <b>${fmt(state.cpm.current_cpm)}</b> / view`)
        : "";
      card.className = "balance-card owner-card";
      card.innerHTML = `
        <div class="owner-eyebrow">Business snapshot</div>
        <div class="balance-row">
          <div class="balance-item pending"><div class="label">Pending withdrawals</div><div class="value">${pendingCount}</div></div>
          <div class="balance-item violet"><div class="label">Awaiting payout</div><div class="value">${fmt(pendingSum)}</div></div>
        </div>
        <div class="cycle-note">👥 <b>${state.stats ? state.stats.total_admins : "…"}</b> admins ·
          📈 CPM: ${cpmLine}</div>
      `;
    } else {
      card.className = "balance-card";
      const pendingViews = state.links.reduce((sum, l) => sum + (l.pending_views || 0), 0);
      let cycleNote = "";
      if (state.cpm && state.cpm.mode === "scheduled") {
        cycleNote = `⏳ Next payout in <b>${secondsToClock(state.cpm.seconds_to_payout)}</b> — rate is set at payout time.`;
      } else if (state.cpm) {
        cycleNote = `📈 Real-time CPM active — currently <b>${fmt(state.cpm.current_cpm)}</b> per view.`;
      }
      card.innerHTML = `
        <div class="balance-row">
          <div class="balance-item confirmed"><div class="label">Confirmed</div><div class="value">${fmt(state.me.balance_confirmed)}</div></div>
          <div class="balance-item pending"><div class="label">Pending views</div><div class="value">${pendingViews}</div></div>
        </div>
        <div class="cycle-note">${cycleNote}</div>
      `;
    }
  }

  // ---- tab dispatch -----------------------------------------------------

  async function renderTab() {
    renderTabs();
    const el = document.getElementById("tabContent");
    el.innerHTML = `<div class="card"><div class="skel" style="height:80px;"></div></div>`;
    try {
      if (state.tab === "overview") await renderOverview(el);
      else if (state.tab === "links") await renderLinks(el);
      else if (state.tab === "traffic") await renderTraffic(el);
      else if (state.tab === "withdraw") await renderWithdraw(el);
      else if (state.tab === "payouts") await renderPayouts(el);
      else if (state.tab === "cpm") await renderCpm(el);
      else if (state.tab === "admins") await renderAdmins(el);
      else if (state.tab === "stats") await renderStats(el);
    } catch (e) {
      el.innerHTML = `<div class="card"><div class="empty">Couldn't load this tab — ${esc(e.message)}</div></div>`;
    }
  }

  // ---- Overview ---------------------------------------------------

  async function renderOverview(el) {
    if (isOwner()) {
      el.innerHTML = `
        <div class="section-title">Quick actions</div>
        <div class="card">
          <button class="btn btn-primary btn-block" id="qaPayouts">Review pending withdrawals${state.withdrawalsPending.length ? ` (${state.withdrawalsPending.length})` : ""}</button>
          <div class="btn-row">
            <button class="btn btn-outline btn-block" id="qaAdmins">View all admins</button>
          </div>
        </div>
        <p style="color:var(--text-faint); font-size:12px; line-height:1.6;">
          Everything else — CPM settings, your own links, platform stats — lives behind the ⋮ menu, top right.
        </p>
      `;
      el.querySelector("#qaPayouts").addEventListener("click", () => { state.tab = "payouts"; renderTab(); });
      el.querySelector("#qaAdmins").addEventListener("click", () => { state.tab = "admins"; renderTab(); });
      return;
    }

    await loadLinks();
    const confirmedViews = state.links.reduce((s, l) => s + (l.confirmed_views || 0), 0);
    const totalViews = state.links.reduce((s, l) => s + (l.view_count || 0), 0);
    el.innerHTML = `
      ${!state.me.traffic_source_url ? `
        <div class="card" style="border-color: rgba(226,104,92,.35);">
          <h3 style="color:var(--red);">⚠️ Traffic Source not set</h3>
          <div class="meta">You need this before you can create any short links.</div>
          <div class="btn-row"><button class="btn btn-primary btn-block" id="ctaTraffic">Set Traffic Source</button></div>
        </div>` : ""}
      <div class="section-title">At a glance</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${state.links.length}</div><div class="l">Links created</div></div>
        <div class="stat-box"><div class="n">${totalViews}</div><div class="l">Total views</div></div>
        <div class="stat-box"><div class="n">${confirmedViews}</div><div class="l">Confirmed views</div></div>
        <div class="stat-box"><div class="n">${fmt(state.me.balance_confirmed)}</div><div class="l">Withdrawable</div></div>
      </div>
      <div class="section-title" style="margin-top:18px;">Quick actions</div>
      <div class="card">
        <button class="btn btn-primary btn-block" id="qaNewLink">+ Create a new short link</button>
        <div class="btn-row">
          <button class="btn btn-outline btn-block" id="qaWithdraw">Request withdrawal</button>
        </div>
      </div>
      <p style="color:var(--text-faint); font-size:12px; line-height:1.6;">
        Tip: you can also do all of this from the bot chat with <code>/newlink</code>, <code>/mybalance</code> and <code>/withdraw</code>.
      </p>
    `;
    const ctaTraffic = el.querySelector("#ctaTraffic");
    if (ctaTraffic) ctaTraffic.addEventListener("click", () => { state.tab = "traffic"; renderTab(); });
    el.querySelector("#qaNewLink").addEventListener("click", () => { state.tab = "links"; renderTab(); });
    el.querySelector("#qaWithdraw").addEventListener("click", () => { state.tab = "withdraw"; renderTab(); });
  }

  // ---- Traffic Source ---------------------------------------------------

  async function renderTraffic(el) {
    await loadMe();
    const platforms = ["Telegram", "YouTube", "Facebook", "TikTok", "Other"];
    el.innerHTML = `
      <div class="card">
        <h3>Your Traffic Source</h3>
        <div class="meta">Where you'll share your short links — the Owner sees this alongside your withdrawal requests.</div>
        ${state.me.traffic_source_url
          ? `<div class="meta" style="margin-top:8px;">Current: <b style="color:var(--text)">${esc(state.me.traffic_source_platform)}</b> —
              <a href="${esc(state.me.traffic_source_url)}" target="_blank" style="color:var(--brass);">${esc(state.me.traffic_source_url)}</a></div>`
          : `<div class="meta" style="color:var(--red); margin-top:8px;">Not set yet — you can't create links until this is set.</div>`}
        <label>Platform</label>
        <select id="tsPlatform">
          ${platforms.map((p) => `<option value="${p}">${p}</option>`).join("")}
        </select>
        <label>Channel / group / profile link</label>
        <input type="url" id="tsUrl" placeholder="https://t.me/yourchannel" value="${esc(state.me.traffic_source_url || "")}" />
        <div class="btn-row"><button class="btn btn-primary btn-block" id="tsSave">Save Traffic Source</button></div>
      </div>
    `;
    const sel = el.querySelector("#tsPlatform");
    if (state.me.traffic_source_platform && platforms.includes(state.me.traffic_source_platform)) {
      sel.value = state.me.traffic_source_platform;
    }
    el.querySelector("#tsSave").addEventListener("click", async () => {
      const platform = sel.value;
      const url = el.querySelector("#tsUrl").value.trim();
      if (!/^https?:\/\//i.test(url)) { toast("Enter a valid http(s) URL", "err"); return; }
      const btn = el.querySelector("#tsSave");
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        await api("/api/traffic-source", { method: "POST", body: JSON.stringify({ platform, url }) });
        toast("Traffic Source saved", "ok");
        await loadMe();
        renderTopCard();
        renderTab();
      } catch (e) {
        toast(e.message, "err");
      } finally {
        btn.disabled = false; btn.textContent = "Save Traffic Source";
      }
    });
  }

  // ---- My Links -----------------------------------------------------

  async function renderLinks(el) {
    await loadLinks();

    if (!state.me.traffic_source_url) {
      el.innerHTML = `
        <div class="card" style="border-color: rgba(226,104,92,.35);">
          <div class="empty" style="padding:14px 4px; color:var(--red);">
            Set your Traffic Source before you can create links.
          </div>
          <button class="btn btn-primary btn-block" id="goTraffic">Set Traffic Source</button>
        </div>
        <div class="section-title">My links</div>
        <div id="linksList"></div>
      `;
      el.querySelector("#goTraffic").addEventListener("click", () => { state.tab = "traffic"; renderTab(); });
      renderLinksList();
      return;
    }

    el.innerHTML = `
      <div class="card">
        <h3>Create a short link</h3>
        <label for="newUrl">Destination URL</label>
        <input type="url" id="newUrl" placeholder="https://example.com/your-page" />
        <div class="btn-row"><button class="btn btn-primary btn-block" id="createLinkBtn">Create link</button></div>
      </div>
      <div class="section-title">My links</div>
      <div id="linksList"></div>
    `;
    el.querySelector("#createLinkBtn").addEventListener("click", async () => {
      const input = el.querySelector("#newUrl");
      const url = input.value.trim();
      if (!/^https?:\/\//i.test(url)) { toast("Enter a valid http(s) URL", "err"); return; }
      const btn = el.querySelector("#createLinkBtn");
      btn.disabled = true; btn.textContent = "Creating…";
      try {
        await api("/api/links", { method: "POST", body: JSON.stringify({ destination_url: url }) });
        input.value = "";
        toast("Short link created", "ok");
        await loadLinks();
        renderLinksList();
      } catch (e) {
        toast(e.message, "err");
      } finally {
        btn.disabled = false; btn.textContent = "Create link";
      }
    });
    renderLinksList();
  }

  function renderLinksList() {
    const listEl = document.getElementById("linksList");
    if (!listEl) return;
    if (state.links.length === 0) {
      listEl.innerHTML = `<div class="card"><div class="empty">No links yet — create your first one above.</div></div>`;
      return;
    }
    listEl.innerHTML = state.links.map((l) => `
      <div class="card">
        <h3>/${esc(l.short_code)}</h3>
        <code class="short-url">${esc(l.short_url)}</code>
        <div class="meta">→ ${esc(l.destination_url)}</div>
        <div class="meta">${l.view_count} views · ${l.confirmed_views} confirmed · ${l.pending_views} pending</div>
      </div>
    `).join("");
  }

  // ---- Withdraw (personal request + history) ---------------------------

  async function renderWithdraw(el) {
    await loadMyWithdrawals();
    el.innerHTML = `
      <div class="card">
        <h3>Request a withdrawal</h3>
        <div class="meta">Confirmed balance: <b style="color:var(--text)">${fmt(state.me.balance_confirmed)}</b></div>
        <label>Method</label>
        <select id="wMethod">
          <option value="bkash">bKash</option>
          <option value="nagad">Nagad</option>
        </select>
        <label>Account number</label>
        <input type="text" id="wAccount" placeholder="01XXXXXXXXX" />
        <label>Amount</label>
        <input type="number" id="wAmount" min="0" step="0.01" placeholder="0.00" />
        <div class="btn-row"><button class="btn btn-primary btn-block" id="wSubmit">Submit request</button></div>
      </div>
      <div class="section-title">History</div>
      <div id="wHistory"></div>
    `;
    el.querySelector("#wSubmit").addEventListener("click", async () => {
      const method = el.querySelector("#wMethod").value;
      const account_number = el.querySelector("#wAccount").value.trim();
      const amount = parseFloat(el.querySelector("#wAmount").value);
      if (!account_number) { toast("Enter an account number", "err"); return; }
      if (!(amount > 0)) { toast("Enter a valid amount", "err"); return; }
      if (amount > state.me.balance_confirmed) { toast("Amount exceeds your confirmed balance", "err"); return; }
      const btn = el.querySelector("#wSubmit");
      btn.disabled = true; btn.textContent = "Submitting…";
      try {
        await api("/api/withdraw", { method: "POST", body: JSON.stringify({ method, account_number, amount }) });
        toast("Withdrawal requested — the Owner has been notified", "ok");
        await loadMe();
        await loadMyWithdrawals();
        renderWithdrawHistory();
        renderTopCard();
      } catch (e) {
        toast(e.message, "err");
      } finally {
        btn.disabled = false; btn.textContent = "Submit request";
      }
    });
    renderWithdrawHistory();
  }

  function renderWithdrawHistory() {
    const histEl = document.getElementById("wHistory");
    if (!histEl) return;
    if (state.withdrawals.length === 0) {
      histEl.innerHTML = `<div class="card"><div class="empty">No withdrawal requests yet.</div></div>`;
      return;
    }
    histEl.innerHTML = state.withdrawals.map((w) => `
      <div class="card">
        <div class="row-between">
          <h3>${fmt(w.amount)} · ${w.method === "bkash" ? "bKash" : "Nagad"}</h3>
          <span class="pill ${w.status}">${w.status}</span>
        </div>
        <div class="meta">Account: ${esc(w.account_number)}</div>
        <div class="meta">Requested ${esc(new Date(w.created_at).toLocaleString())}</div>
        ${w.reject_reason ? `<div class="meta" style="color:var(--red);">Reason: ${esc(w.reject_reason)}</div>` : ""}
      </div>
    `).join("");
  }

  // ---- Owner: Withdrawals queue -----------------------------------------

  async function renderPayouts(el) {
    const data = await api("/api/admin/withdrawals");
    state.withdrawalsPending = data.withdrawals;
    renderTabs();

    if (state.withdrawalsPending.length === 0) {
      el.innerHTML = `<div class="card"><div class="empty">No pending withdrawal requests.</div></div>`;
      return;
    }
    el.innerHTML = state.withdrawalsPending.map((w) => `
      <div class="card">
        <div class="row-between">
          <h3>${fmt(w.amount)} · ${w.method === "bkash" ? "bKash" : "Nagad"}</h3>
          <span class="pill pending">pending</span>
        </div>
        <div class="meta">Admin: ${esc(w.admin_username ? "@" + w.admin_username : "id " + w.admin_telegram_id)}</div>
        <div class="meta">Account: ${esc(w.account_number)}</div>
        <div class="meta">Requested ${esc(new Date(w.created_at).toLocaleString())}</div>
        ${w.traffic_source_url
          ? `<div class="meta">Traffic Source: <a href="${esc(w.traffic_source_url)}" target="_blank" style="color:var(--brass);">${esc(w.traffic_source_platform)} — view ↗</a></div>`
          : `<div class="meta" style="color:var(--red);">No Traffic Source on file</div>`}
        <div class="btn-row">
          <button class="btn btn-success btn-sm payBtn" data-id="${w.request_id}">Mark paid</button>
          <button class="btn btn-danger btn-sm rejectBtn" data-id="${w.request_id}">Reject</button>
        </div>
      </div>
    `).join("");
    el.querySelectorAll(".payBtn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await api(`/api/admin/withdrawals/${btn.dataset.id}/resolve`, { method: "POST", body: JSON.stringify({ decision: "paid" }) });
          toast("Marked as paid", "ok");
          renderTab();
          renderTopCard();
        } catch (e) { toast(e.message, "err"); btn.disabled = false; }
      });
    });
    el.querySelectorAll(".rejectBtn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await api(`/api/admin/withdrawals/${btn.dataset.id}/resolve`, { method: "POST", body: JSON.stringify({ decision: "rejected", reason: "Rejected by owner" }) });
          toast("Request rejected", "ok");
          renderTab();
          renderTopCard();
        } catch (e) { toast(e.message, "err"); btn.disabled = false; }
      });
    });
  }

  // ---- Owner: CPM -------------------------------------------------------

  async function renderCpm(el) {
    const cs = await api("/api/cpm");
    state.cpm = cs;
    el.innerHTML = `
      <div class="card">
        <h3>Global CPM mode</h3>
        <div class="meta">Only one mode runs platform-wide at a time.</div>
        <label>Mode</label>
        <select id="cpmMode">
          <option value="realtime" ${cs.mode === "realtime" ? "selected" : ""}>Real-time — credit instantly</option>
          <option value="scheduled" ${cs.mode === "scheduled" ? "selected" : ""}>Scheduled — batch payout every cycle</option>
        </select>
        <label>CPM rate (per verified view)</label>
        <input type="number" id="cpmRate" min="0" step="0.0001" value="${cs.current_cpm}" />
        <label>Cycle duration (hours) — used only in Scheduled mode</label>
        <input type="number" id="cpmDuration" min="0.5" step="0.5" value="${cs.cycle_duration_hours}" />
        <div class="btn-row"><button class="btn btn-primary btn-block" id="cpmSave">Save CPM settings</button></div>
      </div>
      ${cs.mode === "scheduled" ? `
        <div class="card">
          <div class="meta">Current cycle closes in <b style="color:var(--text)">${secondsToClock(cs.seconds_to_payout)}</b>.
          Whatever rate is set at that moment applies to every view accumulated this cycle.</div>
        </div>` : ""}
    `;
    el.querySelector("#cpmSave").addEventListener("click", async () => {
      const btn = el.querySelector("#cpmSave");
      const mode = el.querySelector("#cpmMode").value;
      const current_cpm = parseFloat(el.querySelector("#cpmRate").value);
      const cycle_duration_hours = parseFloat(el.querySelector("#cpmDuration").value);
      if (!(current_cpm >= 0)) { toast("Enter a valid CPM rate", "err"); return; }
      if (!(cycle_duration_hours > 0)) { toast("Enter a valid cycle duration", "err"); return; }
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        await api("/api/admin/cpm", { method: "POST", body: JSON.stringify({ mode, current_cpm, cycle_duration_hours }) });
        toast("CPM settings updated", "ok");
        renderTab();
        renderTopCard();
      } catch (e) {
        toast(e.message, "err");
      } finally {
        btn.disabled = false; btn.textContent = "Save CPM settings";
      }
    });
  }

  // ---- Owner: Admins ------------------------------------------------

  async function renderAdmins(el) {
    const data = await api("/api/admin/admins");
    state.admins = data.admins;
    el.innerHTML = state.admins.map((a) => `
      <div class="card">
        <div class="row-between">
          <h3>${esc(a.username ? "@" + a.username : "id " + a.telegram_id)}</h3>
          <span class="pill ${a.role === "owner" ? "owner" : a.status}">${a.role === "owner" ? "owner" : a.status}</span>
        </div>
        <div class="meta">${a.role === "owner" ? "Owner" : "Admin"} · <code>${a.telegram_id}</code></div>
        <div class="meta">Confirmed: ${fmt(a.balance_confirmed)}</div>
        ${a.traffic_source_url
          ? `<div class="meta">Traffic Source: <a href="${esc(a.traffic_source_url)}" target="_blank" style="color:var(--brass);">${esc(a.traffic_source_platform)} — view ↗</a></div>`
          : `<div class="meta" style="color:var(--text-faint);">Traffic Source not set</div>`}
        ${a.role !== "owner" ? `
          <div class="btn-row">
            ${a.status === "active"
              ? `<button class="btn btn-danger btn-sm banBtn" data-id="${a.telegram_id}" data-status="banned">Suspend</button>`
              : `<button class="btn btn-success btn-sm banBtn" data-id="${a.telegram_id}" data-status="active">Reactivate</button>`}
          </div>` : ""}
      </div>
    `).join("");
    el.querySelectorAll(".banBtn").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await api(`/api/admin/admins/${btn.dataset.id}/status`, { method: "POST", body: JSON.stringify({ status: btn.dataset.status }) });
          toast("Status updated", "ok");
          renderTab();
        } catch (e) { toast(e.message, "err"); btn.disabled = false; }
      });
    });
  }

  // ---- Owner: Stats -----------------------------------------------------

  async function renderStats(el) {
    const s = await api("/api/admin/stats");
    state.stats = s;
    el.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${s.total_admins}</div><div class="l">Admins</div></div>
        <div class="stat-box"><div class="n">${s.total_links}</div><div class="l">Links</div></div>
        <div class="stat-box"><div class="n">${s.total_views}</div><div class="l">Total views</div></div>
        <div class="stat-box"><div class="n">${s.pending_payout_views}</div><div class="l">Pending views</div></div>
        <div class="stat-box"><div class="n">${fmt(s.total_confirmed_liability)}</div><div class="l">Confirmed liability</div></div>
        <div class="stat-box"><div class="n">${fmt(s.total_paid_out)}</div><div class="l">Total paid out</div></div>
      </div>
    `;
    renderTopCard();
  }

  // ---- data loaders ---------------------------------------------------

  async function loadMe() { state.me = await api("/api/me"); }
  async function loadLinks() { const d = await api("/api/links"); state.links = d.links; }
  async function loadMyWithdrawals() { const d = await api("/api/withdrawals/mine"); state.withdrawals = d.withdrawals; }
  async function loadCpm() { state.cpm = await api("/api/cpm"); }
  async function loadOwnerWithdrawals() { const d = await api("/api/admin/withdrawals"); state.withdrawalsPending = d.withdrawals; }
  async function loadStats() { state.stats = await api("/api/admin/stats"); }

  async function init() {
    if (!initData) {
      document.getElementById("app").innerHTML = `<div class="card" style="margin-top:40px;"><div class="empty">Open this dashboard from inside the TGSHORTBOT Telegram bot.</div></div>`;
      return;
    }
    try {
      await loadMe();
      if (isOwner()) {
        await Promise.all([loadCpm(), loadOwnerWithdrawals(), loadStats()]);
      } else {
        await Promise.all([loadLinks(), loadCpm()]);
      }
      renderTopCard();
      renderDrawer();
      renderTab();
    } catch (e) {
      document.getElementById("app").innerHTML = `<div class="card" style="margin-top:40px;"><div class="empty">Couldn't load your dashboard — ${esc(e.message)}</div></div>`;
    }
  }

  init();
})();
</script>
</body>
</html>
