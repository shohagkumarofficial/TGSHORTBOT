<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TGSHORTBOT — Continue</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e9edf2;
      --muted: #8a93a3;
      --accent: #2ea6ff;
      --accent-pressed: #1e8fd6;
      --success: #2ec27e;
      --warn: #ffb454;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f8fb; --card: #ffffff; --text: #1a1d24; --muted: #5a6473; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 24px 18px 32px; }
    .card { background: var(--card); border-radius: 16px; padding: 22px;
      box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06); }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 12px; color: var(--muted); line-height: 1.45; font-size: 14px; }
    .step { display: flex; gap: 12px; align-items: center; padding: 14px 12px;
      border-radius: 12px; background: rgba(127,127,127,.07); margin-bottom: 10px; }
    .badge { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
      background: var(--accent); color: white; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .badge.done { background: var(--success); }
    .badge.active { box-shadow: 0 0 0 4px rgba(46,166,255,.25); }
    .progress { height: 6px; background: rgba(127,127,127,.15); border-radius: 999px; overflow: hidden; margin: 16px 0 8px; }
    .progress > div { height: 100%; width: 0%; background: var(--accent); transition: width .4s ease; }
    button.primary { width: 100%; padding: 14px 16px; border-radius: 12px; border: 0;
      background: var(--accent); color: white; font-weight: 700; font-size: 16px;
      cursor: pointer; margin-top: 16px; }
    button.primary:disabled { background: var(--muted); cursor: not-allowed; opacity: .8; }
    .msg { margin-top: 14px; font-size: 13px; color: var(--muted); text-align: center; }
    .err { color: #ff6b6b; }
    .timer { font-variant-numeric: tabular-nums; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>One quick step before your link</h1>
      <p>Watch 3 short ads to unlock the destination. Takes ~30 seconds.</p>

      <div class="progress"><div id="bar"></div></div>

      <div class="step" id="s1"><div class="badge" id="b1">1</div><div>Ad 1 of 3</div></div>
      <div class="step" id="s2"><div class="badge" id="b2">2</div><div>Ad 2 of 3</div></div>
      <div class="step" id="s3"><div class="badge" id="b3">3</div><div>Ad 3 of 3</div></div>

      <button id="go" class="primary">▶ Start</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script>
    // runtime config injected by FastAPI (see /r/{code} handler)
    const SHORT_CODE = window.__TG_SHORT_CODE || "";
    const BLOCK_ID = window.__ADSGRAM_BLOCK_ID || "";

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }
    const initData = (tg && tg.initData) || "";

    let step = 0;            // 0..2 = which ad we're showing; 3 = done
    let viewerId = 0;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      viewerId = tg.initDataUnsafe.user.id;
    }

    const goBtn = document.getElementById("go");
    const msg = document.getElementById("msg");
    const bar = document.getElementById("bar");

    function setStep(n) {
      step = n;
      bar.style.width = ((n) * 33.34) + "%";
      for (let i = 1; i <= 3; i++) {
        const el = document.getElementById("s" + i);
        const badge = document.getElementById("b" + i);
        badge.classList.remove("done", "active");
        if (i < n) { badge.classList.add("done"); badge.textContent = "✓"; }
        else if (i === n) { badge.classList.add("active"); }
        else { badge.textContent = i; }
      }
    }

    function fail(text) {
      msg.classList.add("err");
      msg.textContent = text;
      goBtn.disabled = false;
    }

    // ---- Adsgram SDK loader (graceful fallback if blocked) ----
    function loadAdsgram() {
      return new Promise((resolve, reject) => {
        if (!BLOCK_ID) return reject(new Error("no block id configured"));
        if (window.Adsgram) return resolve(window.Adsgram);
        const s = document.createElement("script");
        s.src = "https://adsgram.ai/js/adsgram.js";
        s.onload = () => window.Adsgram ? resolve(window.Adsgram) : reject(new Error("sdk missing"));
        s.onerror = () => reject(new Error("sdk load failed"));
        document.head.appendChild(s);
      });
    }

    async function showAd(idx) {
      const Adsgram = await loadAdsgram();
      const controller = window.Adsgram.init({ blockId: BLOCK_ID });
      // SDK contract: show() returns a Promise that resolves on reward,
      // rejects if the ad is skipped/closed/dismissed.
      return await controller.show();
    }

    async function logViewToServer() {
      const r = await fetch("/api/log-view", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          init_data: initData,
          short_code: SHORT_CODE,
          viewer_telegram_id: viewerId,
        }),
      });
      if (!r.ok) {
        const t = await r.text();
        throw new Error("log-view failed: " + t);
      }
      return await r.json();
    }

    async function runSequence() {
      goBtn.disabled = true;
      msg.classList.remove("err");
      msg.textContent = "";
      try {
        for (let i = 1; i <= 3; i++) {
          setStep(i);
          msg.textContent = "Showing ad " + i + " of 3…";
          await showAd(i);
        }
        msg.textContent = "Logging view…";
        const result = await logViewToServer();
        setStep(3);
        bar.style.width = "100%";
        msg.textContent = "Done — redirecting…";
        // small delay so user sees the success state
        setTimeout(() => {
          if (result && result.destination_url) {
            window.location.href = result.destination_url;
          } else {
            fail("Could not get destination URL.");
          }
        }, 400);
      } catch (e) {
        fail("Ad flow interrupted: " + (e && e.message ? e.message : e));
      }
    }

    goBtn.addEventListener("click", runSequence);

    // no-op if opened outside Telegram (defensive)
    if (!initData) {
      msg.textContent = "Open this from Telegram to continue.";
      goBtn.disabled = true;
    }
  </script>
</body>
</html>
