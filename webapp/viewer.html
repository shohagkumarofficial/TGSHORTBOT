<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Unlocking your link…</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141c;
    --bg-soft: #191c27;
    --panel: #1e2230;
    --hairline: #2b3040;
    --brass: #d9a441;
    --brass-dim: #7a6432;
    --emerald: #3fbf7f;
    --red: #e2685c;
    --text: #f1ede4;
    --text-dim: #9aa0b4;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(120% 90% at 50% -10%, #1c2033 0%, var(--bg) 55%, #0c0e14 100%);
    color: var(--text);
    font-family: var(--body);
    -webkit-tap-highlight-color: transparent;
    overflow-x:hidden;
  }
  .wrap{
    min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 32px 20px 40px;
    text-align:center;
  }
  .eyebrow{
    font-family: var(--display);
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:11px;
    color: var(--text-dim);
    margin-bottom: 22px;
  }

  /* --- Signature element: a 3-tumbler vault dial that fills as each ad completes --- */
  .dial{
    position:relative;
    width:180px; height:180px;
    margin-bottom: 28px;
  }
  .dial svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .dial-track{ fill:none; stroke: var(--hairline); stroke-width:10; }
  .dial-seg{
    fill:none; stroke-width:10; stroke-linecap:round;
    transition: stroke-dashoffset .7s cubic-bezier(.4,0,.2,1), stroke .4s ease;
  }
  .dial-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .dial-step{
    font-family: var(--display);
    font-weight:700;
    font-size: 40px;
    line-height:1;
    color: var(--text);
    letter-spacing:-.02em;
  }
  .dial-step small{ font-size:18px; font-weight:600; color: var(--text-dim); }
  .dial-label{
    margin-top:6px;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: var(--brass);
  }
  .dial-label.unlocked{ color: var(--emerald); }

  h1{
    font-family: var(--display);
    font-weight:600;
    font-size: 21px;
    margin: 0 0 8px;
    letter-spacing:-.01em;
  }
  p.sub{
    margin:0 0 28px;
    color: var(--text-dim);
    font-size: 14px;
    line-height:1.5;
    max-width: 320px;
  }

  .steps{
    display:flex; gap:8px; margin-bottom: 30px;
  }
  .step-dot{
    width:34px; height:6px; border-radius:3px;
    background: var(--hairline);
    transition: background .4s ease;
  }
  .step-dot.done{ background: var(--emerald); }
  .step-dot.active{ background: var(--brass); }

  button.primary{
    font-family: var(--display);
    font-weight:600;
    font-size:15px;
    color:#12141c;
    background: linear-gradient(180deg, #e7bb63, var(--brass));
    border:none;
    border-radius: 999px;
    padding: 15px 34px;
    cursor:pointer;
    box-shadow: 0 8px 24px -8px rgba(217,164,65,.55);
    transition: transform .15s ease, box-shadow .15s ease;
    width: 100%;
    max-width: 300px;
  }
  button.primary:active{ transform: scale(.97); }
  button.primary:disabled{ opacity:.55; cursor:default; box-shadow:none; }

  button.ghost{
    margin-top: 12px;
    background:none; border: 1px solid var(--hairline);
    color: var(--text-dim);
    font-family: var(--body);
    font-size: 13px;
    padding: 10px 22px;
    border-radius: 999px;
    cursor:pointer;
  }

  .status-line{
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
    white-space: pre-line;
  }
  .status-line.error{ color: var(--red); }
  .status-line.ok{ color: var(--emerald); }

  .footer-note{
    position:fixed; bottom:14px; left:0; right:0;
    text-align:center;
    font-size: 11px;
    color: #565c72;
  }
  .footer-note a{
    color: #565c72;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .footer-note a:hover{ color: var(--text-dim); }

  @keyframes spin{ to{ transform: rotate(360deg); } }
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border: 2px solid var(--hairline);
    border-top-color: var(--brass);
    display:inline-block;
    animation: spin .8s linear infinite;
    vertical-align: -3px;
    margin-right:6px;
  }

  @media (prefers-reduced-motion: reduce){
    .dial-seg{ transition:none; }
    .spinner{ animation:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">TGSHORTBOT · SPONSORED UNLOCK</div>

    <div class="dial">
      <svg viewBox="0 0 180 180">
        <circle class="dial-track" cx="90" cy="90" r="78"></circle>
        <g id="segGroup"></g>
      </svg>
      <div class="dial-center">
        <div class="dial-step" id="stepNum">0</div>
        <div class="dial-label" id="dialLabel">LOCKED</div>
      </div>
    </div>

    <div class="steps" id="stepsRow"></div>

    <h1 id="headline">Watch a few short ads to unlock</h1>
    <p class="sub" id="subtext">This link is sponsor-supported — a few quick ads, then you're through to your destination.</p>

    <button class="primary" id="mainBtn">Watch ad</button>
    <button class="ghost" id="retryBtn" style="display:none;">Try that ad again</button>

    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="footer-note">Ads served by our ad partners · <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a></div>

<script>
(function () {
  // ---- Resolve which link this is, and its ad config -------------------
  // Two ways this page gets opened:
  //  1) GET /r/{short_code} (app.py's redirect_entry) — the short_code
  //     and full ad_config are baked into the page source server-side.
  //     This is the fallback flow: bot's /start sends a chat message
  //     with a "চালিয়ে যান" button that opens this page as a WebApp.
  //  2) GET /r (app.py's redirect_entry_direct) — no short_code baked
  //     in. This is the direct-open Mini App flow: Telegram opens this
  //     exact URL straight from a t.me/<bot>/<short_name>?startapp=<code>
  //     link (registered once via @BotFather's /newapp — see README.md),
  //     skipping the chat entirely. Here we read the code from Telegram's
  //     start_param and fetch this link's ad_config ourselves.
  const EMBEDDED_SHORT_CODE = "__SHORT_CODE__";
  const EMBEDDED_AD_CONFIG = __AD_CONFIG_JSON__;
  const EMBEDDED_AD_VIEW_DELAY_SECONDS = "__AD_VIEW_DELAY_SECONDS__";

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor("#12141c");
      tg.setBackgroundColor("#12141c");
    } catch (e) { /* older client versions may not support this */ }
  }

  function resolveShortCodeForDirectOpen() {
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      return tg.initDataUnsafe.start_param;
    }
    const params = new URLSearchParams(window.location.search);
    return params.get("tgWebAppStartParam") || params.get("startapp") || params.get("code") || "";
  }

  const headline = document.getElementById("headline");
  const subtext = document.getElementById("subtext");
  const mainBtn = document.getElementById("mainBtn");

  function showFatalError(text) {
    mainBtn.style.display = "none";
    headline.textContent = "লিংকটি খোলা যায়নি";
    subtext.textContent = text;
  }

  async function boot() {
    let shortCode = EMBEDDED_SHORT_CODE;
    let adConfig = EMBEDDED_AD_CONFIG;
    let adViewDelaySeconds = EMBEDDED_AD_VIEW_DELAY_SECONDS;

    if (!shortCode) {
      shortCode = resolveShortCodeForDirectOpen();
      if (!shortCode) {
        showFatalError("এই লিংকের কোনো তথ্য পাওয়া যায়নি। টেলিগ্রামে দেওয়া লিংকটি থেকে আবার চেষ্টা করুন।");
        return;
      }
      try {
        const resp = await fetch("/api/ad-config/" + encodeURIComponent(shortCode));
        if (!resp.ok) throw new Error("ad-config lookup failed: " + resp.status);
        adConfig = await resp.json();
        adViewDelaySeconds = adConfig.ad_view_delay_seconds;
      } catch (e) {
        showFatalError("লিংকটি খুঁজে পাওয়া যায়নি বা মেয়াদোত্তীর্ণ।");
        return;
      }
    } else if (adConfig && adConfig.ad_view_delay_seconds != null) {
      adViewDelaySeconds = adConfig.ad_view_delay_seconds;
    }

    initViewer(shortCode, adConfig, adViewDelaySeconds);
  }

  function initViewer(SHORT_CODE, AD_CONFIG, adViewDelaySecondsRaw) {
  // Ad count comes straight from the sequence length — one ad per Owner-
  // configured slot in the Ad display order, no padding/repeating (see
  // AdNetworkSetting.slot_sequence's docstring in models.py) — clamped
  // defensively here too in case of a bad value.
  const TOTAL_ADS = Math.max(1, Math.min(20, (AD_CONFIG.sequence || []).length || 1));
  // Ad networks don't always have the next reward ad ready the instant
  // one finishes, so we pause this many seconds before the next ad
  // becomes tappable. Configurable by the Owner from the panel's CPM
  // Settings.
  const AD_VIEW_DELAY_SECONDS = Math.max(0, Number(adViewDelaySecondsRaw) || 0);

  // ---- Multi-network ad SDK loading ----------------------------------
  // Each network's SDK is only fetched the first time a slot actually
  // needs it (not up front for all three), and only once even if it
  // appears at several positions in the sequence.

  const sdkLoadPromises = {};

  function loadScript(src, attrs) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      if (attrs) {
        Object.keys(attrs).forEach((k) => s.setAttribute(k, attrs[k]));
      }
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("failed to load " + src));
      document.head.appendChild(s);
    });
  }

  // GigaPub's primary ad domain occasionally fails to respond (network
  // blocks, DNS hiccups, momentary outages) — this mirrors GigaPub's own
  // recommended "Enhanced Reliability Script" (docs.giga.pub) by racing
  // a 12s timeout against the primary domain and falling back to their
  // secondary domain before giving up, instead of surfacing "ad didn't
  // load" on the very first hiccup.
  function loadGigaPubWithFallback(projectId) {
    const domains = ["https://ad.gigapub.tech", "https://ru-ad.gigapub.tech"];
    const id = encodeURIComponent(projectId || "");

    function tryDomain(i) {
      if (i >= domains.length) {
        return Promise.reject(new Error("GigaPub SDK failed to load from all domains"));
      }
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.async = true;
        s.src = domains[i] + "/script?id=" + id;
        let settled = false;
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          s.onload = s.onerror = null;
          reject(new Error("timed out loading GigaPub from " + domains[i]));
        }, 12000);
        s.onload = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve();
        };
        s.onerror = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(new Error("failed to load GigaPub from " + domains[i]));
        };
        document.head.appendChild(s);
      }).catch(() => tryDomain(i + 1));
    }

    return tryDomain(0);
  }

  function ensureNetworkLoaded(network) {
    if (sdkLoadPromises[network]) return sdkLoadPromises[network];

    if (network === "adsgram") {
      const blockId = (AD_CONFIG.networks.adsgram || {}).block_id || "";
      if (!blockId) {
        sdkLoadPromises[network] = Promise.reject(new Error("Adsgram Block ID not configured"));
      } else {
        sdkLoadPromises[network] = loadScript("https://sad.adsgram.ai/js/sad.min.js");
      }
    } else if (network === "monetag") {
      const cfg = AD_CONFIG.networks.monetag || {};
      const zoneId = cfg.zone_id || "";
      if (!cfg.sdk_url || !zoneId) {
        // Most common misconfiguration: Zone ID filled in but the SDK
        // script URL field left blank (or vice versa). Fail fast with a
        // clear reason instead of pointing a <script> at an empty src,
        // which the browser resolves to the current page and silently
        // "succeeds" without ever defining window["show_<zoneId>"] —
        // that used to surface as a generic, hard-to-diagnose
        // "ad didn't load" on the very first ad.
        sdkLoadPromises[network] = Promise.reject(
          new Error("Monetag Zone ID / SDK script URL not configured")
        );
      } else {
        sdkLoadPromises[network] = loadScript(cfg.sdk_url, {
          "data-zone": zoneId,
          "data-sdk": "show_" + zoneId,
        });
      }
    } else if (network === "gigapub") {
      const cfg = AD_CONFIG.networks.gigapub || {};
      if (!cfg.project_id) {
        sdkLoadPromises[network] = Promise.reject(new Error("GigaPub Project ID not configured"));
      } else {
        sdkLoadPromises[network] = loadGigaPubWithFallback(cfg.project_id);
      }
    } else {
      sdkLoadPromises[network] = Promise.reject(new Error("unknown ad network: " + network));
    }
    return sdkLoadPromises[network];
  }

  // Ad SDKs reject with all sorts of shapes: a real Error, a plain
  // string, a code, or nothing at all ("no fill" cases especially tend
  // to reject with little to no detail). Normalize whatever we get into
  // one readable line for the on-screen diagnostic in showAdError().
  function describeSdkRejection(e) {
    if (!e) return "rejected with no reason given (likely no ad available right now)";
    if (typeof e === "string") return e;
    if (e.message) return e.message;
    try {
      return JSON.stringify(e);
    } catch (_) {
      return String(e);
    }
  }

  // Resolves once the reward for this ad is confirmed by that network's
  // own SDK — mirrors the previous single-network `controller.show()`
  // call, just dispatched per network.
  async function showAdForNetwork(network) {
    await ensureNetworkLoaded(network);

    if (network === "adsgram") {
      if (!window.Adsgram) throw new Error("Adsgram SDK script loaded but window.Adsgram is missing");
      const blockId = (AD_CONFIG.networks.adsgram || {}).block_id || "";
      const controller = window.Adsgram.init({ blockId: blockId });
      try {
        await controller.show();
      } catch (e) {
        throw new Error("Adsgram: " + describeSdkRejection(e));
      }
    } else if (network === "monetag") {
      const zoneId = (AD_CONFIG.networks.monetag || {}).zone_id || "";
      const showFn = window["show_" + zoneId];
      if (typeof showFn !== "function") {
        throw new Error("Monetag SDK script loaded but window.show_" + zoneId + " is missing");
      }
      try {
        await showFn();
      } catch (e) {
        // Most common cause here isn't a broken integration at all — it's
        // "no fill" (this zone has no ad ready for this viewer right now),
        // which a brand-new/low-traffic zone hits constantly at first.
        throw new Error("Monetag: " + describeSdkRejection(e));
      }
    } else if (network === "gigapub") {
      if (typeof window.showGiga !== "function") {
        throw new Error("GigaPub SDK script loaded but window.showGiga is missing");
      }
      try {
        await window.showGiga();
      } catch (e) {
        throw new Error("GigaPub: " + describeSdkRejection(e));
      }
    } else {
      throw new Error("unknown ad network: " + network);
    }
  }

  const CIRC = 2 * Math.PI * 78;
  const SVG_NS = "http://www.w3.org/2000/svg";

  // Build TOTAL_ADS dial segments + step dots up front — the markup
  // above only has the empty containers, since the count is per-link.
  const segGroup = document.getElementById("segGroup");
  const stepsRow = document.getElementById("stepsRow");
  const segEls = [];
  const dots = [];
  for (let i = 0; i < TOTAL_ADS; i++) {
    const seg = document.createElementNS(SVG_NS, "circle");
    seg.setAttribute("class", "dial-seg");
    seg.setAttribute("cx", "90");
    seg.setAttribute("cy", "90");
    seg.setAttribute("r", "78");
    seg.setAttribute("stroke", "var(--hairline)");
    segGroup.appendChild(seg);
    segEls.push(seg);

    const dot = document.createElement("div");
    dot.className = "step-dot";
    stepsRow.appendChild(dot);
    dots.push(dot);
  }

  const stepNum = document.getElementById("stepNum");
  const dialLabel = document.getElementById("dialLabel");
  const retryBtn = document.getElementById("retryBtn");
  const statusLine = document.getElementById("statusLine");

  let adsWatched = 0;
  let inFlight = false;

  function setStatus(text, kind) {
    statusLine.textContent = text || "";
    statusLine.className = "status-line" + (kind ? " " + kind : "");
  }

  function setBusyStatus(text) {
    statusLine.innerHTML = '<span class="spinner"></span>' + text;
    statusLine.className = "status-line";
  }

  function renderProgress() {
    stepNum.innerHTML = adsWatched + "<small>/" + TOTAL_ADS + "</small>";
    for (let i = 0; i < TOTAL_ADS; i++) {
      dots[i].className = "step-dot" + (i < adsWatched ? " done" : i === adsWatched ? " active" : "");
    }
    // Fill each segment fully in its own arc share as it completes. A
    // smaller gap when there are many segments keeps thin slices visible.
    const gapPx = TOTAL_ADS > 6 ? 3 : 6;
    segEls.forEach((el, idx) => {
      const filled = idx < adsWatched;
      const segLen = Math.max(2, CIRC / TOTAL_ADS - gapPx);
      el.style.stroke = filled ? "var(--emerald)" : "var(--hairline)";
      el.style.strokeDashoffset = filled ? 0 : CIRC;
      el.style.strokeDasharray = segLen + " " + (CIRC - segLen);
      const rotation = idx * (360 / TOTAL_ADS);
      el.setAttribute("transform", "rotate(" + rotation + " 90 90)");
    });

    if (adsWatched >= TOTAL_ADS) {
      dialLabel.textContent = "UNLOCKED";
      dialLabel.classList.add("unlocked");
    } else {
      dialLabel.textContent = "LOCKED";
    }
  }

  function showAdError(err) {
    mainBtn.style.display = "none";
    retryBtn.style.display = "inline-block";
    // Surface the real reason in small print under the friendly message —
    // there's no browser devtools inside Telegram's in-app view, so this
    // is the only way to tell "SDK never loaded" apart from "SDK loaded
    // fine but this network had no ad to show" (no fill) without asking
    // the viewer to plug their phone into a computer.
    const detail = err && err.message ? String(err.message) : "";
    setStatus(
      "The ad didn't load. This happens sometimes — try again." +
        (detail ? "\n" + detail : ""),
      "error"
    );
  }

  function showAdStep(n) {
    headline.textContent = "Watch ad " + n + " of " + TOTAL_ADS + " to unlock";
    subtext.textContent = "Tap below, watch the full ad, and it counts automatically.";
    mainBtn.textContent = "Watch ad " + n + " of " + TOTAL_ADS;
    mainBtn.style.display = "inline-block";
    retryBtn.style.display = "none";
    mainBtn.disabled = false;
    setStatus("");
  }

  // Ad networks generally need a short gap to have the next ad ready —
  // show a disabled, counting-down button instead of letting the tap
  // through immediately (which would just surface an ad-not-loaded
  // error).
  function waitBeforeNextAd(n) {
    // Start loading the *next* ad's network SDK right away — by the
    // time the countdown (or an instant resolve, below) finishes, it's
    // often already loaded, so the following "Loading ad…" wait is
    // shorter. Errors here are swallowed; showAdForNetwork()'s own
    // ensureNetworkLoaded() call will surface any real failure when the
    // viewer actually taps the button.
    const nextNetwork = AD_CONFIG.sequence[n - 1] || AD_CONFIG.sequence[0];
    ensureNetworkLoaded(nextNetwork).catch(() => {});

    return new Promise((resolve) => {
      if (!AD_VIEW_DELAY_SECONDS) {
        showAdStep(n);
        resolve();
        return;
      }

      headline.textContent = "Ad " + (n - 1) + " of " + TOTAL_ADS + " counted";
      subtext.textContent = "The next ad needs a moment to load — hang tight.";
      retryBtn.style.display = "none";
      mainBtn.style.display = "inline-block";
      mainBtn.disabled = true;
      setStatus("");

      let remaining = Math.ceil(AD_VIEW_DELAY_SECONDS);
      const renderCountdown = () => {
        mainBtn.textContent = "Next ad ready in " + remaining + "s";
      };
      renderCountdown();

      const timer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(timer);
          showAdStep(n);
          resolve();
          return;
        }
        renderCountdown();
      }, 1000);
    });
  }

  async function playAd() {
    if (inFlight) return;
    inFlight = true;
    mainBtn.disabled = true;
    setBusyStatus(" Loading ad…");

    const network = AD_CONFIG.sequence[adsWatched] || AD_CONFIG.sequence[0];

    try {
      await showAdForNetwork(network);
      // Resolved => reward earned for this ad.
      adsWatched += 1;
      renderProgress();
      inFlight = false;

      if (adsWatched >= TOTAL_ADS) {
        await finishAndRedirect();
      } else {
        await waitBeforeNextAd(adsWatched + 1);
      }
    } catch (err) {
      inFlight = false;
      mainBtn.disabled = false;
      showAdError(err);
    }
  }

  async function finishAndRedirect() {
    headline.textContent = "Unlocked — taking you there";
    subtext.textContent = "Hold on a second while we confirm your view.";
    mainBtn.style.display = "none";
    retryBtn.style.display = "none";
    setBusyStatus(" Confirming…");

    const initData = tg ? tg.initData : "";

    try {
      const logResp = await fetch("/api/log-view", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Telegram-Init-Data": initData,
        },
        body: JSON.stringify({ short_code: SHORT_CODE }),
      });
      if (!logResp.ok) throw new Error("log-view failed: " + logResp.status);

      const linkResp = await fetch("/api/link/" + encodeURIComponent(SHORT_CODE), {
        headers: { "X-Telegram-Init-Data": initData },
      });
      if (!linkResp.ok) throw new Error("link lookup failed: " + linkResp.status);
      const linkData = await linkResp.json();

      setStatus("Redirecting…", "ok");
      window.location.href = linkData.destination_url;
    } catch (err) {
      setStatus("Something went wrong confirming your view. Please try again.", "error");
      retryBtn.textContent = "Try again";
      retryBtn.style.display = "inline-block";
      retryAction = finishAndRedirect;
    }
  }

  let retryAction = playAd;
  mainBtn.addEventListener("click", playAd);
  retryBtn.addEventListener("click", () => retryAction());

  renderProgress();
  showAdStep(1);
  ensureNetworkLoaded(AD_CONFIG.sequence[0]).catch(() => {});
  } // end initViewer

  boot();
})();
</script>
