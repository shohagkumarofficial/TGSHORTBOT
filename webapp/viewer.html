<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Unlocking your link…</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141c;
    --bg-soft: #191c27;
    --panel: #1e2230;
    --hairline: #2b3040;
    --brass: #d9a441;
    --brass-dim: #7a6432;
    --emerald: #3fbf7f;
    --red: #e2685c;
    --text: #f1ede4;
    --text-dim: #9aa0b4;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(120% 90% at 50% -10%, #1c2033 0%, var(--bg) 55%, #0c0e14 100%);
    color: var(--text);
    font-family: var(--body);
    -webkit-tap-highlight-color: transparent;
    overflow-x:hidden;
  }
  .wrap{
    min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 32px 20px 40px;
    text-align:center;
  }
  .eyebrow{
    font-family: var(--display);
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:11px;
    color: var(--text-dim);
    margin-bottom: 22px;
  }

  /* --- Signature element: a 3-tumbler vault dial that fills as each ad completes --- */
  .dial{
    position:relative;
    width:180px; height:180px;
    margin-bottom: 28px;
  }
  .dial svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .dial-track{ fill:none; stroke: var(--hairline); stroke-width:10; }
  .dial-seg{
    fill:none; stroke-width:10; stroke-linecap:round;
    transition: stroke-dashoffset .7s cubic-bezier(.4,0,.2,1), stroke .4s ease;
  }
  .dial-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .dial-step{
    font-family: var(--display);
    font-weight:700;
    font-size: 40px;
    line-height:1;
    color: var(--text);
    letter-spacing:-.02em;
  }
  .dial-step small{ font-size:18px; font-weight:600; color: var(--text-dim); }
  .dial-label{
    margin-top:6px;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: var(--brass);
  }
  .dial-label.unlocked{ color: var(--emerald); }

  h1{
    font-family: var(--display);
    font-weight:600;
    font-size: 21px;
    margin: 0 0 8px;
    letter-spacing:-.01em;
  }
  p.sub{
    margin:0 0 28px;
    color: var(--text-dim);
    font-size: 14px;
    line-height:1.5;
    max-width: 320px;
  }

  .steps{
    display:flex; gap:8px; margin-bottom: 30px;
  }
  .step-dot{
    width:34px; height:6px; border-radius:3px;
    background: var(--hairline);
    transition: background .4s ease;
  }
  .step-dot.done{ background: var(--emerald); }
  .step-dot.active{ background: var(--brass); }

  button.primary{
    font-family: var(--display);
    font-weight:600;
    font-size:15px;
    color:#12141c;
    background: linear-gradient(180deg, #e7bb63, var(--brass));
    border:none;
    border-radius: 999px;
    padding: 15px 34px;
    cursor:pointer;
    box-shadow: 0 8px 24px -8px rgba(217,164,65,.55);
    transition: transform .15s ease, box-shadow .15s ease;
    width: 100%;
    max-width: 300px;
  }
  button.primary:active{ transform: scale(.97); }
  button.primary:disabled{ opacity:.55; cursor:default; box-shadow:none; }

  button.ghost{
    margin-top: 12px;
    background:none; border: 1px solid var(--hairline);
    color: var(--text-dim);
    font-family: var(--body);
    font-size: 13px;
    padding: 10px 22px;
    border-radius: 999px;
    cursor:pointer;
  }

  .status-line{
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 18px;
  }
  .status-line.error{ color: var(--red); }
  .status-line.ok{ color: var(--emerald); }

  .footer-note{
    position:fixed; bottom:14px; left:0; right:0;
    text-align:center;
    font-size: 11px;
    color: #565c72;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }
  .spinner{
    width:16px; height:16px; border-radius:50%;
    border: 2px solid var(--hairline);
    border-top-color: var(--brass);
    display:inline-block;
    animation: spin .8s linear infinite;
    vertical-align: -3px;
    margin-right:6px;
  }

  @media (prefers-reduced-motion: reduce){
    .dial-seg{ transition:none; }
    .spinner{ animation:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">TGSHORTBOT · SPONSORED UNLOCK</div>

    <div class="dial">
      <svg viewBox="0 0 180 180">
        <circle class="dial-track" cx="90" cy="90" r="78"></circle>
        <circle id="seg1" class="dial-seg" cx="90" cy="90" r="78" stroke="var(--hairline)"></circle>
        <circle id="seg2" class="dial-seg" cx="90" cy="90" r="78" stroke="var(--hairline)"></circle>
        <circle id="seg3" class="dial-seg" cx="90" cy="90" r="78" stroke="var(--hairline)"></circle>
      </svg>
      <div class="dial-center">
        <div class="dial-step" id="stepNum">0<small>/3</small></div>
        <div class="dial-label" id="dialLabel">LOCKED</div>
      </div>
    </div>

    <div class="steps">
      <div class="step-dot" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
    </div>

    <h1 id="headline">Watch 3 short ads to unlock</h1>
    <p class="sub" id="subtext">This link is sponsor-supported — three quick ads, then you're through to your destination.</p>

    <button class="primary" id="mainBtn">Watch ad 1 of 3</button>
    <button class="ghost" id="retryBtn" style="display:none;">Try that ad again</button>

    <div class="status-line" id="statusLine"></div>
  </div>

  <div class="footer-note">Ads served by Adsgram</div>

<script>
(function () {
  const SHORT_CODE = "__SHORT_CODE__";
  const BLOCK_ID = "__ADSGRAM_BLOCK_ID__";
  const TOTAL_ADS = 3;

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try {
      tg.setHeaderColor("#12141c");
      tg.setBackgroundColor("#12141c");
    } catch (e) { /* older client versions may not support this */ }
  }

  const CIRC = 2 * Math.PI * 78;
  const segEls = [document.getElementById("seg1"), document.getElementById("seg2"), document.getElementById("seg3")];
  segEls.forEach((el) => {
    el.style.strokeDasharray = CIRC;
    el.style.strokeDashoffset = CIRC;
  });

  const stepNum = document.getElementById("stepNum");
  const dialLabel = document.getElementById("dialLabel");
  const headline = document.getElementById("headline");
  const subtext = document.getElementById("subtext");
  const mainBtn = document.getElementById("mainBtn");
  const retryBtn = document.getElementById("retryBtn");
  const statusLine = document.getElementById("statusLine");
  const dots = [document.getElementById("dot1"), document.getElementById("dot2"), document.getElementById("dot3")];

  let adsWatched = 0;
  let inFlight = false;

  function setStatus(text, kind) {
    statusLine.textContent = text || "";
    statusLine.className = "status-line" + (kind ? " " + kind : "");
  }

  function setBusyStatus(text) {
    statusLine.innerHTML = '<span class="spinner"></span>' + text;
    statusLine.className = "status-line";
  }

  function renderProgress() {
    stepNum.innerHTML = adsWatched + "<small>/3</small>";
    for (let i = 0; i < TOTAL_ADS; i++) {
      dots[i].className = "step-dot" + (i < adsWatched ? " done" : i === adsWatched ? " active" : "");
    }
    // Fill each segment fully in its own arc third as it completes.
    segEls.forEach((el, idx) => {
      const filled = idx < adsWatched;
      el.style.stroke = filled ? "var(--emerald)" : "var(--hairline)";
      el.style.strokeDashoffset = filled ? 0 : CIRC;
      el.style.strokeDasharray = CIRC / TOTAL_ADS - 6 + " " + (CIRC - (CIRC / TOTAL_ADS - 6));
      const rotation = (idx * 120);
      el.setAttribute("transform", "rotate(" + rotation + " 90 90)");
    });

    if (adsWatched >= TOTAL_ADS) {
      dialLabel.textContent = "UNLOCKED";
      dialLabel.classList.add("unlocked");
    } else {
      dialLabel.textContent = "LOCKED";
    }
  }

  function showAdError() {
    mainBtn.style.display = "none";
    retryBtn.style.display = "inline-block";
    setStatus("The ad didn't load. This happens sometimes — try again.", "error");
  }

  function showAdStep(n) {
    headline.textContent = "Watch ad " + n + " of 3 to unlock";
    subtext.textContent = "Tap below, watch the full ad, and it counts automatically.";
    mainBtn.textContent = "Watch ad " + n + " of 3";
    mainBtn.style.display = "inline-block";
    retryBtn.style.display = "none";
    mainBtn.disabled = false;
    setStatus("");
  }

  async function playAd() {
    if (inFlight) return;
    inFlight = true;
    mainBtn.disabled = true;
    setBusyStatus(" Loading ad…");

    if (!window.Adsgram) {
      inFlight = false;
      mainBtn.disabled = false;
      setStatus("Ad network failed to load. Check your connection and try again.", "error");
      return;
    }

    try {
      const controller = window.Adsgram.init({ blockId: BLOCK_ID });
      await controller.show();
      // Resolved => reward earned for this ad.
      adsWatched += 1;
      renderProgress();
      inFlight = false;

      if (adsWatched >= TOTAL_ADS) {
        await finishAndRedirect();
      } else {
        showAdStep(adsWatched + 1);
      }
    } catch (err) {
      inFlight = false;
      mainBtn.disabled = false;
      showAdError();
    }
  }

  async function finishAndRedirect() {
    headline.textContent = "Unlocked — taking you there";
    subtext.textContent = "Hold on a second while we confirm your view.";
    mainBtn.style.display = "none";
    retryBtn.style.display = "none";
    setBusyStatus(" Confirming…");

    const initData = tg ? tg.initData : "";

    try {
      const logResp = await fetch("/api/log-view", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Telegram-Init-Data": initData,
        },
        body: JSON.stringify({ short_code: SHORT_CODE }),
      });
      if (!logResp.ok) throw new Error("log-view failed: " + logResp.status);

      const linkResp = await fetch("/api/link/" + encodeURIComponent(SHORT_CODE), {
        headers: { "X-Telegram-Init-Data": initData },
      });
      if (!linkResp.ok) throw new Error("link lookup failed: " + linkResp.status);
      const linkData = await linkResp.json();

      setStatus("Redirecting…", "ok");
      window.location.href = linkData.destination_url;
    } catch (err) {
      setStatus("Something went wrong confirming your view. Please try again.", "error");
      retryBtn.textContent = "Try again";
      retryBtn.style.display = "inline-block";
      retryAction = finishAndRedirect;
    }
  }

  let retryAction = playAd;
  mainBtn.addEventListener("click", playAd);
  retryBtn.addEventListener("click", () => retryAction());

  renderProgress();
  showAdStep(1);
})();
</script>
</body>
</html>
